  const money = v => formatMoney(Math.round(v * 100) / 100, cfg.mCur);
  const fmt = (b, v) => (b.m.money ? money(v) : Math.floor(v).toLocaleString('de-DE')) + (b.m.perHour ? '/h' : '');
  function hourly(kind) {
    const now = Date.now();
    st.log = st.log.filter(([t]) => now - t < 3600e3 * 1.05);
    if (kind === 'rolling') return st.log.filter(([t]) => now - t < 3600e3).reduce((a, [, v]) => a + v, 0);
    const h = Math.max(0.5, (now - st.streamStart) / 3600e3);
    return st.s.money / h;
  }
  function valueOf(b) {
    switch (b.m.scope) {
      case 's': return st.s[b.m.key];
      case 't': return st.t[b.m.key] + b.start;
      case 'live': return live[b.m.key] || 0;
      case 'c': return st.counter;
      case 'hour': return hourly(b.m.key);
    }
    return 0;
  }
  const goalOf = b => st.goals[b.i] ?? b.goal;
  function uptime() {
    const m = Math.floor((Date.now() - st.streamStart) / 60000);
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' h';
  }

  /* --- Darstellung --- */
  function titleText(b, v) {
    const g = goalOf(b);
    if (b.m.scope === 'live' && liveErr[b.m.key] && live[b.m.key] == null)
      return b.m.key === 'subs' ? '⚠ Sub-Stand: im Editor bei decapi freischalten' : '⚠ ' + b.label + ': keine Daten';
    return b.tpl.replace(/\{(\w+)\}/g, (_, x) => ({
      label: b.label, current: fmt(b, v), goal: fmt(b, g),
      percent: g ? Math.floor(Math.min(1, v / g) * 100) + '%' : '', remaining: fmt(b, Math.max(0, g - v)),
      peak: fmt(b, st.peak[b.i] || v),
    }[x] ?? ''));
  }
  function render(b, animateFrom) {
    const txt = b.el.querySelector('.bb-text'), fill = b.el.querySelector('.bb-fill');
    if (b.metric === 'boss') {
      const B = boss();
      const r = Math.max(0, B.hp / B.max);
      setW(b, r);
      b.el.classList.toggle('armor', r <= .5 && r > 0);
      b.el.classList.toggle('low', r <= .2 && r > 0);
      if (!b.el.classList.contains('dead')) txt.textContent = b.tpl.replace(/\{(\w+)\}/g, (_, x) => ({
        label: b.label, current: Math.ceil(Math.max(0, B.hp)).toLocaleString('de-DE'), goal: B.max.toLocaleString('de-DE'), percent: Math.ceil(r * 100) + '%',
        level: B.level, last: B.last || '–', remaining: Math.ceil(Math.max(0, B.hp)),
      }[x] ?? ''));
      return;
    }
    const v = valueOf(b), g = goalOf(b);
    if (v > (st.peak[b.i] || 0)) st.peak[b.i] = v;
    // Ohne Ziel: Balken zeigt das Verhältnis zum Höchstwert (z. B. Zuschauer-Rekord dieses Streams)
    const ref = g > 0 ? g : (st.peak[b.i] || 0);
    const ratio = ref > 0 ? Math.max(0, Math.min(1, v / ref)) : (g > 0 ? 0 : 1);
    const shown = b.dir === 'drain' && g > 0 ? 1 - ratio : ratio;
    setW(b, shown);
    b.el.classList.toggle('low', b.dir === 'drain' && g > 0 && shown <= .2 && shown > 0);
    b.el.classList.toggle('near', g > 0 && ratio >= .9 && ratio < 1);
    if (b.el.classList.contains('done')) return;
    // Zahlen hochzählen lassen
    if (b.countUp && animateFrom != null && animateFrom !== v) {
      const t0 = performance.now(), dur = 900, from = animateFrom;
      cancelAnimationFrame(b.raf);
      const step = now => {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        txt.textContent = titleText(b, from + (v - from) * e);
        if (k < 1) b.raf = requestAnimationFrame(step);
      };
      b.raf = requestAnimationFrame(step);
    } else txt.textContent = titleText(b, v);
  }
  function renderAll() { bars.forEach(b => render(b)); renderTop(); }
  // Füllung sofort, weiße „Schadensspur“ folgt verzögert (wie in Kampfspielen)
  function setW(b, r) {
    const pct = (Math.max(0, Math.min(1, r)) * 100).toFixed(2) + '%';
    b.el.querySelector('.bb-fill').style.width = pct;
    b.el.querySelector('.bb-ghost').style.width = pct;
  }
  // Wither-Partikel: dunkler Rauch, der aus dem Balken aufsteigt
  if (bars.some(b => b.aura)) setInterval(() => {
    for (const b of bars) {
      if (!b.aura) continue;
      if (Math.random() > (b.metric === 'boss' ? .9 : .45)) continue;
      const w = parseFloat(b.el.querySelector('.bb-fill').style.width) || 0;
      if (w <= 0) continue;
      const p = document.createElement('div');
      p.className = 'bb-smoke';
      p.style.left = (Math.random() * w) + '%';
      p.style.setProperty('--dx', (Math.random() * 2 - 1) * 6 + 'px');
      p.style.background = Math.random() < .5 ? 'rgba(10,0,15,.85)' : 'var(--c3)';
      b.el.querySelector('.bb-track').appendChild(p);
      setTimeout(() => p.remove(), 1600);
    }
  }, 260);

  function floatText(b, text, cls = '') {
    if (!b.popups) return;
    const f = document.createElement('div');
    f.className = 'bb-float ' + cls;
    f.textContent = text;
    const w = parseFloat(b.el.querySelector('.bb-fill').style.width) || 0;
    f.style.left = Math.min(92, Math.max(8, w)) + '%';
    b.el.appendChild(f);
    setTimeout(() => f.remove(), 2300);
  }
  function flash(b, hurt) {
    b.el.classList.remove('hit', 'hurt'); void b.el.offsetWidth;
    b.el.classList.add('hit'); if (hurt) b.el.classList.add('hurt');
  }

  /* --- Ziel erreicht: Feier + nächstes Ziel --- */
  function celebrate(b, text) {
    b.el.classList.add('done');
    b.el.querySelector('.bb-text').textContent = text;
    burst(b.el);
    sound('levelup');
    setTimeout(() => { b.el.classList.remove('done'); render(b); }, 5000);
  }
  function burst(el) {
    const track = el.querySelector('.bb-track');
    for (let k = 0; k < 28; k++) {
      const p = document.createElement('div');
      p.className = 'xp';
      p.style.left = (10 + Math.random() * 80) + '%';
      p.style.setProperty('--dx', (Math.random() * 2 - 1) * 60 + 'px');
      p.style.setProperty('--dy', -(20 + Math.random() * 70) + 'px');
      p.style.background = ['#c4ff4d', '#7dff3a', '#f5ff7a', '#e0ff5c'][k % 4];
      p.style.animationDelay = (Math.random() * .3) + 's';
      track.appendChild(p);
      setTimeout(() => p.remove(), 1800);
    }
  }

  /* --- Änderungen anwenden --- */
  function update(delta, liveDelta = 0, liveKey = '') {
    const before = bars.map(b => b.metric === 'boss' ? 0 : valueOf(b));
    for (const k of STAT_KEYS) if (delta[k]) { st.s[k] += delta[k]; st.t[k] += delta[k]; }
    if (delta.money > 0) st.log.push([Date.now(), delta.money]);
    if (delta.counter) st.counter += delta.counter;
    if (liveKey) live[liveKey] = (live[liveKey] || 0) + liveDelta;
    if (delta.subs && live.subs != null && liveKey !== 'subs') live.subs += delta.subs; // sofort zählen, Twitch bestätigt später
    save();
    bars.forEach((b, idx) => {
      if (b.metric === 'boss') return;
      let d;
      switch (b.m.scope) {
        case 'live': d = b.m.key === liveKey ? liveDelta : (b.m.key === 'subs' && live.subs != null ? delta.subs || 0 : 0); break;
        case 'c': d = delta.counter || 0; break;
        case 'hour': d = delta.money > 0 ? delta.money : 0; break;
        default: d = delta[b.m.key] || 0;
      }
      if (!d) return;
      render(b, before[idx]);
      if (b.m.key !== 'msgs' && b.m.key !== 'viewers') {
        flash(b, b.dir === 'drain' && goalOf(b) > 0);
        floatText(b, (d > 0 ? '+' : '') + (b.m.money ? money(d) : Math.round(d) + (b.m.unit ? ' ' + b.m.unit : '')), d < 0 ? 'neg' : '');
      }
      const g = goalOf(b), v = valueOf(b);
      if (g > 0 && before[idx] < g && v >= g) {
        if (b.step > 0) { let ng = g; while (ng <= v) ng += b.step; st.goals[b.i] = ng; save(); }
        celebrate(b, cfg.mDoneTpl.replace('{goal}', fmt(b, g)).replace('{label}', b.label));
      }
    });
    renderTop();
  }

  /* --- 💀 Wither-Bosskampf --- */
  const bossBar = bars.find(b => b.metric === 'boss');
  const lastHit = {};
  function boss() {
    if (!st.boss) st.boss = { hp: bossBar ? bossBar.goal : 100, max: bossBar ? bossBar.goal : 100, level: 1, dmg: {}, last: '' };
    return st.boss;
  }
  function damage(name, amount, big) {
    if (!bossBar || !(amount > 0) || bossBar.el.classList.contains('dead')) return;
    const B = boss();
    B.hp -= amount; B.last = name;
    B.dmg[name] = (B.dmg[name] || 0) + amount;
    flash(bossBar, true);
    if (big || amount >= 5) floatText(bossBar, `-${Math.round(amount)} ${name}`, 'neg');
    if (B.hp <= 0) {
      const mvp = Object.entries(B.dmg).sort((a, b) => b[1] - a[1])[0];
      bossBar.el.classList.add('dead');
      bossBar.el.querySelector('.bb-text').textContent = cfg.mBossDeadTpl.replace('{level}', B.level).replace('{mvp}', mvp ? mvp[0] : name).replace('{last}', name);
      setW(bossBar, 0);
      burst(bossBar.el); sound('explode');
      setTimeout(() => {
        B.level++; B.max = Math.round(B.max * cfg.mBossGrow); B.hp = B.max; B.dmg = {}; B.last = '';
        bossBar.el.classList.remove('dead'); save(); render(bossBar); sound('spawn');
      }, 7000);
    }
    save(); render(bossBar);
  }

  /* --- 🔥 Hype-Zug --- */
  const hype = { count: 0, until: 0, timer: null };
  const hypeEl = extra.querySelector('.bb-hype');
  function hypeHit(n = 1) {
    if (!cfg.mHype) return;
    const now = Date.now();
    if (now > hype.until) hype.count = 0;
    hype.count += n;
    hype.until = now + cfg.mHypeWin * 1000;
    if (hype.count >= cfg.mHypeMin) {
      hypeEl.hidden = false;
      hypeEl.classList.remove('pop'); void hypeEl.offsetWidth; hypeEl.classList.add('pop');
      hypeEl.querySelector('.bb-hype-text').textContent = `🔥 HYPE-ZUG · Stufe ${Math.min(5, 1 + Math.floor((hype.count - cfg.mHypeMin) / 3))} · ${hype.count} Events`;
      if (!hype.timer) hype.timer = setInterval(tickHype, 200);
    }
  }
  function tickHype() {
    const left = hype.until - Date.now();
    hypeEl.querySelector('.bb-hype-fill').style.width = Math.max(0, left / (cfg.mHypeWin * 1000) * 100) + '%';
    if (left <= 0) {
      clearInterval(hype.timer); hype.timer = null;
      hypeEl.querySelector('.bb-hype-text').textContent = `Hype-Zug vorbei – ${hype.count} Events! 🎉`;
      hype.count = 0;
      setTimeout(() => { if (!hype.timer) hypeEl.hidden = true; }, 4000);
    }
  }

  /* --- 🏆 Top-Supporter --- */
  const topEl = extra.querySelector('.bb-top');
  function renderTop() {
    if (!cfg.mTop) return;
    const best = Object.entries(st.top).sort((a, b) => b[1] - a[1])[0];
    topEl.hidden = !best;
    if (best) topEl.textContent = cfg.mTopTpl.replace('{name}', best[0]).replace('{amount}', money(best[1]));
  }

  /* --- 📰 Laufband: wechselnde Infos --- */
  const tickEl = extra.querySelector('.bb-ticker');
  let tickIdx = 0;
  function tickerItems() {
    const it = [];
    if (cfg.mTkUptime) it.push(`⏱ Live seit ${uptime()}`);
    if (cfg.mTkViewers && live.viewers != null) it.push(`👀 ${live.viewers} Zuschauer`);
    if (cfg.mTkSubs && live.subs != null) it.push(`⭐ ${live.subs} Subs`);
    if (cfg.mTkHourly) it.push(`💶 ${money(hourly('rolling'))}/h (letzte 60 Min.)`);
    if (cfg.mTkHourAvg) it.push(`📈 Ø ${money(hourly('avg'))}/h in diesem Stream`);
    if (cfg.mTkMoney) it.push(`💰 ${money(st.s.money)} in diesem Stream`);
    if (cfg.mTkLastSub && st.last.sub) it.push(`⭐ Letztes Abo: ${st.last.sub}`);
    if (cfg.mTkLastFollow && st.last.follow) it.push(`❤️ Letzter Follower: ${st.last.follow}`);
    if (cfg.mTkLastTip && st.last.tip) it.push(`💸 Letzte Spende: ${st.last.tip}`);
    if (cfg.mTkLastBits && st.last.bits) it.push(`💎 Letzte Bits: ${st.last.bits}`);
    if (cfg.mTkStats) it.push(`💬 ${st.s.msgs} Nachrichten · ⭐ ${st.s.subs} Abos · 💎 ${st.s.bits} Bits`);
    return it;
  }
  function tick() {
    const it = tickerItems();
    tickEl.hidden = !it.length;
    if (!it.length) return;
    tickIdx = (tickIdx + 1) % it.length;
    tickEl.classList.remove('swap'); void tickEl.offsetWidth; tickEl.classList.add('swap');
    tickEl.textContent = it[tickIdx];
  }
  if (cfg.mTicker) { tickIdx = -1; setTimeout(tick, 300); setInterval(tick, cfg.mTickerSec * 1000); }

  /* --- Sounds (Minecraft-ähnlich, ohne Dateien) --- */
  let actx;
  function sound(kind) {
    if (!cfg.mSound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const seq = { levelup: [[523, 0], [659, .1], [784, .2], [1047, .3]], explode: [[90, 0], [60, .08], [40, .16]], spawn: [[110, 0], [98, .25], [82, .5]] }[kind];
      seq.forEach(([f, d]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = kind === 'levelup' ? 'square' : 'sawtooth';
        o.frequency.value = f;
        const t0 = actx.currentTime + d;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(cfg.mVolume / 100 * .18, t0 + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + (kind === 'levelup' ? .25 : .6));
        o.connect(g).connect(actx.destination);
        o.start(t0); o.stop(t0 + .7);
      });
    } catch {}
  }

  /* --- Events verarbeiten --- */
  function planValue(plan) { return plan === 'Prime' ? cfg.mPrime : plan === '2000' ? cfg.mSub2 : plan === '3000' ? cfg.mSub3 : cfg.mSub1; }
  function onEvent(ev) {
    if (!ev) return;
    const d = {};
    let who = ev.name, worth = 0, dmg = 0;
    switch (ev.kind) {
      case 'sub': case 'resub': d.subs = ev.kind === 'sub' ? 1 : 0; worth = d.money = planValue(ev.plan); dmg = cfg.mBossSub; st.last.sub = who; break;
      case 'gift': d.subs = 1; d.gifts = 1; worth = d.money = planValue(ev.plan); dmg = cfg.mBossSub; st.last.sub = (ev.recipient || '?') + ' (von ' + who + ')'; break;
      case 'mass': d.subs = ev.amount; d.gifts = ev.amount; worth = d.money = planValue(ev.plan) * ev.amount; dmg = cfg.mBossSub * ev.amount; st.last.sub = `${ev.amount} Geschenke von ${who}`; break;
      case 'bits': d.bits = ev.amount; worth = d.money = ev.amount * cfg.mBit; dmg = ev.amount * cfg.mBossBit; st.last.bits = `${who} (${ev.amount})`; break;
      case 'tip': d.tips = Number(ev.amount) || 0; worth = cfg.mTips ? d.tips : 0; if (cfg.mTips) d.money = d.tips; dmg = d.tips * cfg.mBossTip; st.last.tip = `${who} (${money(d.tips)})`; break;
      case 'follow': d.follows = 1; dmg = cfg.mBossMsg * 5; st.last.follow = who; break;
      case 'raid': d.raiders = ev.viewers; dmg = ev.viewers * cfg.mBossMsg; break;
      default: return;
    }
    if (worth > 0 && who) st.top[who] = (st.top[who] || 0) + worth;
    update(d);
    if (dmg > 0) damage(who || '???', dmg, true);
    if (['sub', 'resub', 'gift', 'mass', 'tip'].includes(ev.kind) || (ev.kind === 'bits' && ev.amount >= 100)) hypeHit(ev.kind === 'mass' ? ev.amount : 1);
  }
  const botSet = new Set(splitList(cfg.botList));
  function onChat(name, login) {
    if (botSet.has(login)) return;
    update({ msgs: 1 });
    const now = Date.now();
    if (now - (lastHit[login] || 0) >= cfg.mBossCd * 1000) { lastHit[login] = now; damage(name, cfg.mBossMsg, false); }
  }

  /* --- Chat-Befehle (Streamer & Mods) --- */
  const parseEvent = createEventParser();
  const cmd = (cfg.mCmd || '!bar').toLowerCase();
  function command(text) {
    const p = text.trim().split(/\s+/);
    if (p[0].toLowerCase() !== cmd) return false;
    const op = (p[1] || '').toLowerCase();
    const num = x => parseFloat(String(x || '').replace(',', '.'));
    const n = num(p[2]);
    if (op === 'add' && n) update({ money: n });
    else if (op === 'remove' && n) update({ money: -n });
    else if (op === 'reset') { resetStream(); renderAll(); }
    else if (op === 'total' && !isNaN(n)) { const b = bars.find(x => x.metric === 'money_total'); st.t.money = n - (b ? b.start : 0); save(); renderAll(); }
    else if (op === 'set' && SET_ALIASES[(p[2] || '').toLowerCase()] && !isNaN(num(p[3]))) {
      const k = SET_ALIASES[p[2].toLowerCase()]; const b = bars.find(x => x.m.key === k && x.m.scope === 't');
      st.t[k] = num(p[3]) - (b ? b.start : 0); save(); renderAll();
    }
    else if (op === 'count') {
      const a = (p[2] || '+1').toLowerCase();
      if (a === 'reset') { st.counter = 0; save(); renderAll(); }
      else if (/^[+-]/.test(a)) update({ counter: num(a) || 0 });
      else if (!isNaN(num(a))) { st.counter = num(a); save(); renderAll(); }
    }
    else if (op === 'boss' && (p[2] || '').toLowerCase() === 'reset') { st.boss = null; save(); renderAll(); }
    return true;
  }
  function handle(m) {
    if (m.command === 'PRIVMSG') {
      const text = m.params[1] || '';
      if (isStaff(m.tags) && command(text)) return;
      if (!m.tags.bits) onChat(m.tags['display-name'] || m.login, (m.login || '').toLowerCase());
    }
    onEvent(parseEvent(m));
  }

  window.addEventListener('message', e => {
    if (!e.data || e.data.tco !== 'test') return;
    const k = e.data.kind;
    if (k === 'reset') { resetStream(); renderAll(); return; }
    if (k === 'msg') { const n = ['Lurker42', 'ModMaxi', 'NeuerZuschauer', 'VipVanessa'][Math.floor(Math.random() * 4)]; lastHit[n.toLowerCase()] = 0; onChat(n, n.toLowerCase()); return; }
    if (k === 'count') { command(cmd + ' count +1'); return; }
    if (k === 'viewers') { update({}, Math.round(Math.random() * 30 - 10), 'viewers'); return; }
    onEvent(sampleEvent(k));
  });

  renderAll();
  setInterval(renderAll, 30000); // Stundenlohn & Uhrzeit aktuell halten
  if (cfg.channel) connectIRC(cfg.channel, handle);
  if (cfg.seToken) connectSE(cfg.seToken.trim(), onEvent);
  if (cfg.slToken) connectSL(cfg.slToken.trim(), onEvent);
  if (cfg.demo) {
    const kinds = ['sub', 'bits', 'tip', 'gift', 'follow', 'msg', 'msg', 'msg', 'viewers'];
    setTimeout(function loop() {
      const k = kinds[Math.floor(Math.random() * kinds.length)];
      if (k === 'msg') { const n = 'Zuschauer' + Math.floor(Math.random() * 20); onChat(n, n.toLowerCase()); }
      else if (k === 'viewers') update({}, Math.round(Math.random() * 16 - 6), 'viewers');
      else onEvent(sampleEvent(k));
      setTimeout(loop, 1500 + Math.random() * 1500);
    }, 1000);
  }
}

/* =====================================================================
   QUIZSHOW
   ===================================================================== */
function quizNorm(s) {
  return String(s || '').toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/^(der|die|das|the|ein|eine)\s+/, '')
    .replace(/[^a-z0-9]/g, '');
}
function levenshtein(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// Liste aller richtigen Antworten (bei Auswahlfragen: Buchstabe + Text)
function quizAnswers(item) {
  const opts = item.o ? item.o.split('|').map(s => s.trim()).filter(Boolean) : [];
  let list = String(item.a || '').split('|').map(s => s.trim()).filter(Boolean);
  if (opts.length) {
    const L = 'ABCDEFGH';
    const idx = list.map(a => a.length === 1 && L.includes(a.toUpperCase()) ? L.indexOf(a.toUpperCase()) : opts.findIndex(o => quizNorm(o) === quizNorm(a))).filter(i => i >= 0);
    list = idx.flatMap(i => [L[i], opts[i]]);
  }
  return { list, opts };
}
function quizMatch(guess, item, fuzzy) {
  const g = quizNorm(guess);
  if (!g) return false;
  const { list, opts } = quizAnswers(item);
  return list.some(a => {
    const n = quizNorm(a);
    if (!n) return false;
    if (g === n) return true;
    if (opts.length && n.length === 1) return false;          // Buchstabe muss exakt passen
    if (!fuzzy || /^\d+$/.test(n)) return false;              // Zahlen müssen exakt sein
    const tol = n.length >= 9 ? 2 : n.length >= 5 ? 1 : 0;
    return tol > 0 && levenshtein(g, n) <= tol;
  });
}
function quizBoard(cfg) {
  try { const b = JSON.parse(cfg.qBoard); if (Array.isArray(b) && b.length) return b; } catch {}
  return QUIZ_DEFAULT_BOARD;
}
const quizPoints = cfg => String(cfg.qPoints || '').split(/[,;\s]+/).map(Number).filter(n => n > 0);

function startQuiz(cfg) {
  document.body.className = 'overlay';
  const root = document.createElement('div');
  root.id = 'quiz';
  root.className = 'qz theme-' + cfg.qTheme;
  // Größe passt sich der Höhe der Quelle an (bei 1080 px Höhe = eingestellte Größe)
  root.style.setProperty('--q', `min(${cfg.qSize}px, ${(cfg.qSize / 10.8).toFixed(3)}vh)`);
  root.style.setProperty('--qfont', fontStack(cfg.qFont, cfg.fontFile));
  document.body.appendChild(root);

  const board = quizBoard(cfg);
  const points = quizPoints(cfg);
  const sig = JSON.stringify([board, points]).length + ':' + points.join(',') + ':' + board.map(c => c.n).join(',');
  const preview = cfg.demo || window.top !== window;
  const KEY = 'tco-quiz:' + (cfg.channel || 'x').toLowerCase() + (preview ? ':preview' : '');
  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
  st.used = st.sig === sig ? (st.used || {}) : {};
  st.scores = st.scores || {};
  st.sig = sig;
  if (cfg.demo) { st.used = { '0-0': 1, '2-1': 1, '1-0': 1 }; st.scores = { GamerGirl_99: 30, Lurker42: 15, ModMaxi: 5 }; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
  save();

  let view = 'board', cur = null, timer = null, backTimer = null, hidden = false;
  const cellItem = (c, r) => board[c] && board[c].q && board[c].q[r] && board[c].q[r].q ? board[c].q[r] : null;
  const openCells = () => { const l = []; board.forEach((c, ci) => points.forEach((p, r) => { if (cellItem(ci, r) && !st.used[ci + '-' + r]) l.push([ci, r]); })); return l; };
  const txt = s => cfg.mcCodes && hasMcCodes(s) ? mcFormat(s, {}) : esc(s);

  function leaderHtml(n = 5) {
    const top = Object.entries(st.scores).sort((a, b) => b[1] - a[1]).slice(0, n);
    if (!cfg.qLeader || !top.length) return '';
    const medal = ['🥇', '🥈', '🥉'];
    return `<div class="qz-leader"><div class="qz-lh">🏆 Bestenliste</div>${top.map(([nm, p], i) => `<div class="qz-lr"><span>${medal[i] || (i + 1) + '.'} ${esc(nm)}</span><b>${p}</b></div>`).join('')}</div>`;
  }
  function render() {
    root.hidden = hidden;
    if (view === 'board') {
      const cols = board.length;
      let h = `<div class="qz-wrap"><div class="qz-title">${txt(cfg.qTitle)}</div><div class="qz-board" style="grid-template-columns:repeat(${cols},1fr)">`;
      board.forEach(c => { h += `<div class="qz-cat">${txt(c.n)}</div>`; });
      points.forEach((p, r) => board.forEach((c, ci) => {
        const it = cellItem(ci, r), used = st.used[ci + '-' + r];
        h += `<div class="qz-cell${!it ? ' empty' : used ? ' used' : ''}" data-c="${ci}" data-r="${r}">${it && !used ? p : ''}</div>`;
      }));
      h += `</div>${leaderHtml()}</div>`;
      root.innerHTML = h;
    } else if (view === 'question' || view === 'reveal') {
      const { opts } = quizAnswers(cur.item);
      const L = 'ABCDEFGH';
      let h = `<div class="qz-panel ${view}"><div class="qz-head"><span>${txt(board[cur.c].n)}</span><span class="qz-pts">${cur.pts} Punkte</span></div>
        <div class="qz-text">${txt(cur.item.q)}</div>`;
      if (opts.length) {
        const right = quizAnswers(cur.item).list;
        h += `<div class="qz-opts">${opts.map((o, i) => `<div class="qz-opt${view === 'reveal' && right.includes(L[i]) ? ' right' : ''}"><b>${L[i]}</b> ${txt(o)}</div>`).join('')}</div>`;
      }
      if (view === 'question') {
        if (cfg.qChat) h += `<div class="qz-hint">${opts.length ? 'Schreib A, B, C oder D in den Chat!' : 'Schreib die Antwort in den Chat!'}</div>`;
        if (cfg.qTime > 0) h += `<div class="qz-timer"><div class="qz-tfill"></div><span class="qz-tsec">${cfg.qTime}</span></div>`;
      } else {
        const ans = String(cur.item.a).split('|')[0];
        const shown = opts.length && ans.length === 1 ? `${ans.toUpperCase()}: ${opts['ABCDEFGH'.indexOf(ans.toUpperCase())] || ''}` : ans;
        h += `<div class="qz-answer">✔ ${txt(shown)}</div>`;
        h += cur.winner ? `<div class="qz-winner">🎉 <b>${esc(cur.winner)}</b> hat richtig! +${cur.pts}</div>` : `<div class="qz-winner none">${cur.timeout ? '⏱ Zeit abgelaufen – niemand hatte es richtig.' : 'Auflösung'}</div>`;
      }
      root.innerHTML = h + '</div>';
      if (view === 'question' && cfg.qTime > 0) tickTimer();
    } else if (view === 'final') {
      const top = Object.entries(st.scores).sort((a, b) => b[1] - a[1]).slice(0, 3);
      const pod = [1, 0, 2].map(i => top[i] ? `<div class="qz-pod p${i + 1}"><div class="qz-pn">${esc(top[i][0])}</div><div class="qz-pp">${top[i][1]} Punkte</div><div class="qz-pb">${i + 1}</div></div>` : '').join('');
      root.innerHTML = `<div class="qz-panel final"><div class="qz-title">🏆 Quiz beendet!</div><div class="qz-podium">${pod || '<div class="qz-hint">Niemand hat gepunktet.</div>'}</div></div>`;
      confetti(); sound('win');
    }
  }

  function tickTimer() {
    const fill = root.querySelector('.qz-tfill'), sec = root.querySelector('.qz-tsec');
    clearInterval(timer);
    let lastS = -1;
    timer = setInterval(() => {
      const left = Math.max(0, cur.endsAt - Date.now());
      if (fill) fill.style.width = (left / (cfg.qTime * 1000) * 100) + '%';
      const s = Math.ceil(left / 1000);
      if (sec) sec.textContent = s;
      if (s !== lastS && s <= 5 && s > 0) sound('tick');
      lastS = s;
      if (left <= 0) { clearInterval(timer); reveal(null, true); }
    }, 100);
  }
  function open(c, r) {
    const it = cellItem(c, r);
    if (!it || st.used[c + '-' + r]) return;
    clearTimeout(backTimer);
    cur = { c, r, item: it, pts: points[r], tried: new Set(), endsAt: Date.now() + cfg.qTime * 1000 };
    view = 'question'; hidden = false; sound('open'); render();
  }
  function reveal(winner, timeout) {
    if (view !== 'question' || !cur) return;
    clearInterval(timer);
    st.used[cur.c + '-' + cur.r] = 1;
    cur.winner = winner || null; cur.timeout = !!timeout;
    if (winner) { st.scores[winner] = (st.scores[winner] || 0) + cur.pts; sound('right'); }
    else sound('wrong');
    save();
    view = 'reveal'; render();
    if (winner) confetti();
    if (cfg.qAutoBack > 0) backTimer = setTimeout(back, cfg.qAutoBack * 1000);
  }
  function back() {
    clearTimeout(backTimer); clearInterval(timer);
    view = openCells().length ? 'board' : 'final'; render();
  }
  function random() { const l = openCells(); if (l.length) { const [c, r] = l[Math.floor(Math.random() * l.length)]; open(c, r); } }

  root.addEventListener('click', e => {   // In OBS: Rechtsklick → „Interagieren“
    const cell = e.target.closest('.qz-cell');
    if (view === 'board' && cell) open(+cell.dataset.c, +cell.dataset.r);
    else if (view === 'question') reveal(null, false);
    else if (view === 'reveal' || view === 'final') back();
  });

  /* --- Konfetti & Sounds --- */
  function confetti() {
    const cols = cfg.qTheme === 'mc' ? ['#55FF55', '#FFFF55', '#55FFFF', '#FF55FF', '#FFAA00'] : ['#ffd54f', '#ff5370', '#4fc3f7', '#69f0ae', '#b388ff'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('div');
      p.className = 'qz-conf';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = cols[i % cols.length];
      p.style.setProperty('--dx', (Math.random() * 2 - 1) * 200 + 'px');
      p.style.animationDelay = Math.random() * .6 + 's';
      p.style.animationDuration = 2 + Math.random() * 1.5 + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4500);
    }
  }
  let actx;
  function sound(kind) {
    if (!cfg.qSound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const seq = {
        open: [[784, 0, 'triangle', .3], [1175, .12, 'triangle', .4]],                       // Notenblock „Pling“
        tick: [[1400, 0, 'square', .05]],
        right: [[523, 0, 'square', .2], [659, .1, 'square', .2], [784, .2, 'square', .2], [1047, .3, 'square', .4]],
        wrong: [[220, 0, 'sawtooth', .25], [165, .2, 'sawtooth', .45]],
        win: [[523, 0, 'square', .2], [659, .15, 'square', .2], [784, .3, 'square', .2], [1047, .45, 'square', .25], [784, .7, 'square', .15], [1047, .85, 'square', .6]],
      }[kind];
      seq.forEach(([f, d, type, len]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        const t0 = actx.currentTime + d;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(cfg.qVolume / 100 * .2, t0 + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + len);
        o.connect(g).connect(actx.destination);
        o.start(t0); o.stop(t0 + len + .05);
      });
    } catch {}
  }

  /* --- Steuerung über Chat --- */
  const cmd = (cfg.qCmd || '!quiz').toLowerCase();
  const bots = new Set(splitList(cfg.botList));
  function command(text, by) {
    const p = text.trim().split(/\s+/);
    if (p[0].toLowerCase() !== cmd) return false;
    const op = (p[1] || '').toLowerCase();
    if (!op || op === 'brett' || op === 'board' || op === 'an' || op === 'start') { hidden = false; back(); }
    else if (op === 'aus' || op === 'hide') { hidden = true; render(); }
    else if (op === 'zufall' || op === 'random') random();
    else if (['lösung', 'loesung', 'reveal', 'aufloesen', 'auflösen'].includes(op)) reveal(null, false);
    else if (op === 'weiter' || op === 'next') back();
    else if (op === 'richtig' && p[2]) { if (view === 'question') reveal(p[2].replace(/^@/, ''), false); }
    else if (op === 'punkte' && p[2] && p[3]) { const n = parseInt(p[3], 10); if (!isNaN(n)) { const nm = p[2].replace(/^@/, ''); st.scores[nm] = (st.scores[nm] || 0) + n; save(); render(); } }
    else if (op === 'neu') { st.used = {}; save(); back(); }
    else if (op === 'reset') { st.used = {}; st.scores = {}; save(); back(); }
    else if (op === 'ende' || op === 'final') { view = 'final'; render(); }
    else {
      // !quiz <Kategorie> <Punkte>  (Nummer oder Name)
      const pts = parseInt(p[p.length - 1], 10);
      const catArg = p.slice(1, -1).join(' ').toLowerCase();
      let c = /^\d+$/.test(catArg) ? parseInt(catArg, 10) - 1 : board.findIndex(x => quizNorm(x.n).startsWith(quizNorm(catArg)));
      const r = points.indexOf(pts);
      if (c >= 0 && r >= 0) open(c, r);
    }
    return true;
  }
  function onChat(name, login, text, staff) {
    if (staff && command(text, name)) return;
    if (view !== 'question' || !cfg.qChat || bots.has(login)) return;
    if (cfg.qOneTry) { if (cur.tried.has(login)) return; cur.tried.add(login); }
    if (quizMatch(text, cur.item, cfg.qFuzzy)) reveal(name, false);
  }
  function handle(m) {
    if (m.command !== 'PRIVMSG') return;
    onChat(m.tags['display-name'] || m.login, (m.login || '').toLowerCase(), m.params[1] || '', isStaff(m.tags));
  }

  window.addEventListener('message', e => {
    if (!e.data || e.data.tco !== 'test') return;
    const k = e.data.kind, viewer = ['GamerGirl', 'Lurker', 'VipVanessa', 'Zuschauer'][Math.floor(Math.random() * 4)] + Math.floor(Math.random() * 100);
    if (k === 'q-board') back();
    else if (k === 'q-random') random();
    else if (k === 'q-reveal') reveal(null, false);
    else if (k === 'q-correct' && view === 'question') { const a = quizAnswers(cur.item).list[0] || ''; onChat(viewer, viewer.toLowerCase(), a, false); }
    else if (k === 'q-wrong' && view === 'question') onChat(viewer, viewer.toLowerCase(), 'keine Ahnung', false);
    else if (k === 'q-final') { view = 'final'; render(); }
    else if (k === 'q-reset') { st.used = {}; st.scores = {}; save(); back(); }
  });

  if (!openCells().length && Object.keys(st.used).length) view = 'final';
  render();
  if (cfg.channel) connectIRC(cfg.channel, handle);
}

/* ---------- Beispiel-Events (Vorschau / Test) ---------- */
function sampleEvent(kind, emotes) {
  const names = ['GamerGirl_99', 'Lurker42', 'VipVanessa', 'ModMaxi', 'NeuerZuschauer'];
  const n = names[Math.floor(Math.random() * names.length)];
  const em = Array.from((emotes && emotes.keys()) || []);
  const e = () => em.length ? em[Math.floor(Math.random() * Math.min(em.length, 60))] : 'Kappa';
  switch (kind) {
    case 'sub': return { kind, name: n, tier: 'Stufe 1', plan: '1000', months: 1, message: '' };
    case 'resub': return { kind, name: n, tier: 'Prime', plan: 'Prime', months: 14, message: `Schon über ein Jahr dabei ${e()}` };
    case 'gift': return { kind, name: n, recipient: 'Lurker42', tier: 'Stufe 1', plan: '1000' };
    case 'mass': return { kind, name: n, amount: 5, tier: 'Stufe 1', plan: '1000' };
    case 'raid': return { kind, name: 'CoolerStreamer', viewers: 87 };
    case 'bits': return { kind, name: n, amount: 500, message: `Cheer500 Gönn dir was ${e()}` };
    case 'follow': return { kind, name: n + Math.floor(Math.random() * 99) };
    case 'tip': return { kind, name: n, amount: 10, currency: 'EUR', message: `Danke für den Stream! ${e()}` };
    case 'announce': return { kind, name: 'ModMaxi', message: 'Heute Abend um 20 Uhr startet das Turnier!' };
    case 'popup': return { kind, title: 'Gleich gibt es eine Pause – bleibt dran!', by: 'ModMaxi' };
  }
}

/* ---------- Demo-Nachrichten für die Chat-Vorschau ---------- */
function runDemoChat(handle, emotes) {
  const users = [
    ['Streamer', 'broadcaster/1,subscriber/0', '#FF4A4A'],
    ['ModMaxi', 'moderator/1,subscriber/12', '#00C853'],
    ['VipVanessa', 'vip/1,subscriber/6', '#FF69B4'],
    ['Lurker42', 'subscriber/3', '#1E90FF'],
    ['NeuerZuschauer', '', ''],
    ['Nightbot', 'moderator/1', '#7C7CE1'],
    ['GamerGirl_99', 'subscriber/24,premium/1', '#DAA520'],
  ];
  const lines = [
    'Hallo zusammen! {e}', 'Was für ein Play {e} {e}', 'gg {e}', '{e}', '{e} {e} {e}',
    'wie heißt das Spiel?', 'Kappa', 'Ich bin seit 2 Jahren dabei {e}', '@Streamer du bist der Beste {e}',
    'LUL das war knapp', '!discord', 'erster mal hier, schöner Stream {e}', 'PogChamp {e}',
  ];
  const twitchIds = { Kappa: '25', PogChamp: '305954156', LUL: '425618' };
  let n = 0;
  function tick() {
    const names = Array.from(emotes.keys());
    const u = users[Math.floor(Math.random() * users.length)];
    let text = lines[Math.floor(Math.random() * lines.length)];
    text = text.replace(/\{e\}/g, () => names.length ? names[Math.floor(Math.random() * Math.min(names.length, 80))] : 'Kappa');
    const em = {};
    let idx = 0;
    for (const w of text.split(' ')) {
      const len = Array.from(w).length;
      if (twitchIds[w] && !emotes.has(w)) (em[twitchIds[w]] ||= []).push(`${idx}-${idx + len - 1}`);
      idx += len + 1;
    }
    const tags = { 'first-msg': u[0] === 'NeuerZuschauer' ? '1' : '0', 'msg-id': Math.random() < .07 ? 'highlighted-message' : '', 'display-name': u[0], badges: u[1], color: u[2], emotes: Object.entries(em).map(([id, r]) => id + ':' + r.join(',')).join('/'), id: 'demo' + (n++) };
    if (Math.random() < .08) {
      // gelegentlich ein Sub-Event im Chat zeigen
      handle({ command: 'USERNOTICE', login: u[0].toLowerCase(), params: ['#demo', 'Danke für alles!'], tags: { ...tags, emotes: '', login: u[0].toLowerCase(), 'msg-id': 'resub', 'msg-param-cumulative-months': '7', 'msg-param-sub-plan': '1000' } });
    } else {
      if (Math.random() < .06) text = '\u0001ACTION tanzt herum ' + (names[0] || '') + '\u0001';
      handle({ command: 'PRIVMSG', login: u[0].toLowerCase(), params: ['#demo', text], tags });
    }
    setTimeout(tick, 900 + Math.random() * 1400);
  }
  setTimeout(tick, 700);
}

  fontStack('Inter');
  let state = { ...DEFAULTS };
  try {
    const saved = JSON.parse(localStorage.getItem('tco-config') || '{}');
    const legacy = {};
    for (const k of Object.keys(saved)) if (k in LEGACY && !(k in DEFAULTS)) { legacy[k] = saved[k]; delete saved[k]; }
    Object.assign(state, saved);
    applyLegacy(state, legacy, new Set(Object.keys(saved).filter(k => !(k in LEGACY))));
  } catch {}
  let tab = 'chat';
  try { tab = localStorage.getItem('tco-tab') || 'chat'; } catch {}

    qzEd.innerHTML = b.length ? b.map((c, ci) => `
      <div class="qz-ecat">
        <div class="inl"><input type="text" data-qn="${ci}" value="${esc(c.n)}" style="flex:1;font-weight:700">
          <button class="sm ghost" data-qmove="${ci}:-1" title="Nach links">◀</button><button class="sm ghost" data-qmove="${ci}:1" title="Nach rechts">▶</button><button class="sm ghost" data-qdel="${ci}" title="Entfernen">✕</button></div>
        ${pts.map((p, r) => { const it = (c.q || [])[r] || {}; return `
          <div class="qz-erow"><span class="qz-ep">${p}</span>
            <input type="text" data-qq="${ci}:${r}:q" value="${esc(it.q || '')}" placeholder="Frage">
            <input type="text" data-qq="${ci}:${r}:a" value="${esc(it.a || '')}" placeholder="Antwort">
            <input type="text" data-qq="${ci}:${r}:o" value="${esc(it.o || '')}" placeholder="Auswahl (optional): A|B|C|D">
          </div>`; }).join('')}
      </div>`).join('') : '<div class="hint">Noch keine Kategorien – wähl oben Themen aus der Bibliothek.</div>';
    if (b.length > 8) qzEd.insertAdjacentHTML('afterbegin', '<div class="warn">Mehr als 8 Kategorien werden auf dem Brett sehr eng.</div>');
  }
  qzEd.addEventListener('input', e => {
    const b = getBoard(), t = e.target;
    if (t.dataset.qn != null) b[+t.dataset.qn].n = t.value;
    else if (t.dataset.qq) {
      const [ci, r, f] = t.dataset.qq.split(':');
      const c = b[+ci]; c.q = c.q || [];
      while (c.q.length <= +r) c.q.push({ q: '', a: '' });
      c.q[+r][f] = t.value;
      if (f === 'o' && !t.value) delete c.q[+r].o;
    } else return;
    setBoard(b, false);
  });
  qzEd.addEventListener('click', e => {
    const b = getBoard(), t = e.target;
    if (t.dataset.qdel != null) { b.splice(+t.dataset.qdel, 1); setBoard(b); }
    else if (t.dataset.qmove) { const [i, d] = t.dataset.qmove.split(':').map(Number); const j = i + d; if (j >= 0 && j < b.length) { [b[i], b[j]] = [b[j], b[i]]; setBoard(b); } }
  });
  const libCopy = c => ({ n: c.n, q: c.q.map(x => ({ ...x })) });
  document.querySelectorAll('[data-lib]').forEach(btn => btn.onclick = () => { const b = getBoard(); b.push(libCopy(QUIZ_LIBRARY[+btn.dataset.lib])); setBoard(b); });
  $('#qzRandom').onclick = () => setBoard([...QUIZ_LIBRARY].sort(() => Math.random() - .5).slice(0, 5).map(libCopy));
  $('#qzAddOwn').onclick = () => { const b = getBoard(); b.push({ n: 'Neue Kategorie', q: quizPoints(state).map(() => ({ q: '', a: '' })) }); setBoard(b); };
  $('#qzClear').onclick = () => { if (confirm('Alle Kategorien vom Brett entfernen?')) setBoard([]); };
  $('#qzExport').onclick = () => { $('#qzJson').value = JSON.stringify(getBoard(), null, 1); };
  $('#qzImport').onclick = () => {
    try { const b = JSON.parse($('#qzJson').value); if (!Array.isArray(b)) throw 0; setBoard(b); alert('Brett übernommen ✓'); }
    catch { alert('Das sieht nicht nach einem gültigen Brett aus.'); }
  };
  renderQuizEditor();

}

/* ---------- Start ---------- */
const cfg = readConfig();
if (cfg && (cfg.channel || cfg.demo || cfg.seToken || cfg.slToken || cfg.mode === 'quiz')) {
  window.addEventListener('hashchange', () => location.reload());
  if (cfg.mode === 'alerts') startAlerts(cfg); else if (cfg.mode === 'bar') startBar(cfg); else if (cfg.mode === 'quiz') startQuiz(cfg); else startChat(cfg);
} else startEditor();
</script>
</body>
</html>
