<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Stream Overlay</title>
<style>
  :root { --bg:#0e0e10; --panel:#18181b; --line:#2f2f35; --text:#efeff1; --muted:#adadb8; --accent:#9147ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }

  /* ================= GEMEINSAM (Overlay) ================= */
  body.overlay { background: transparent; overflow: hidden; }
  .ov {
    font-family: var(--font, 'Inter');
    font-weight: var(--weight, 600); color: var(--color, #fff); line-height: 1.35;
  }
  .ov .badge { height: 1em; width: auto; vertical-align: -0.12em; margin-right: .2em; border-radius: 3px; }
  .ov .fbadge { display:inline-flex; align-items:center; justify-content:center; height:1em; min-width:1em; padding:0 .15em; margin-right:.2em; vertical-align:-0.12em; border-radius:3px; font-size:.7em; font-weight:800; color:#fff; text-shadow:none; }
  .ov .emote-wrap { display: inline-grid; vertical-align: middle; margin: -.25em .05em; }
  .ov .emote-wrap > img { grid-area: 1/1; justify-self: center; align-self: center; }
  .ov img.emote { height: calc(var(--esize, 1.6) * 1em); width: auto; vertical-align: middle; }
  .ov .mention { font-weight: 800; }

  /* ================= CHAT ================= */
  #chat {
    position: fixed; inset: 0; padding: var(--pad, 10px);
    display: flex; flex-direction: column; justify-content: flex-end; gap: var(--gap, 6px);
    overflow: hidden; font-size: var(--size, 20px);
  }
  #chat.top { justify-content: flex-start; }
  .msg {
    display: block; word-wrap: break-word; overflow-wrap: anywhere;
    padding: var(--mpad, 0); border-radius: var(--radius, 8px);
    background: var(--mbg, transparent);
    text-shadow: var(--shadow, none);
    -webkit-text-stroke: var(--stroke, 0);
    animation-duration: var(--dur, 400ms); animation-fill-mode: both;
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
    transform-origin: left center;
  }
  .msg.action .text { font-style: italic; }
  .msg .name { font-weight: var(--nweight, 800); }
  .msg .sep { margin-right: .3em; }
  .msg.big-emotes img.emote { height: calc(var(--esize, 1.6) * 1.8em); }
  .msg.removing { animation-name: out-fade !important; animation-duration: 500ms; }
  .msg.block .name { display: block; }
  .msg.block .sep { display: none; }
  .msg.event {
    border-left: 4px solid var(--ecol, #9147ff); padding: .4em .65em; border-radius: var(--radius, 8px);
  }
  .msg.event .etitle { font-weight: 800; }
  .msg.event .etitle b { color: #fff; }
  .msg.event .emsg { display: block; margin-top: .2em; font-weight: var(--weight, 600); opacity: .95; }

  /* ================= ALERTS ================= */
  #alerts { position: fixed; inset: 0; display: flex; justify-content: center; padding: 4%; pointer-events: none; }
  #alerts.pos-top { align-items: flex-start; }
  #alerts.pos-center { align-items: center; }
  #alerts.pos-bottom { align-items: flex-end; }
  #alerts.al-left { justify-content: flex-start; }
  #alerts.al-right { justify-content: flex-end; }
  .alert {
    --acol: #9147ff;
    position: relative; max-width: 92%;
    font-size: var(--asize, 34px);
    font-family: var(--font, 'Inter'); font-weight: var(--weight, 600);
    text-shadow: var(--shadow, none);
    animation: var(--ain, a-pop) var(--adur-in, 600ms) cubic-bezier(.2,.8,.2,1) both;
  }
  .alert .gif { margin: 0 auto .2em; width: max-content; max-width: 100%; }
  .alert .gif img { display: block; height: var(--agif, 240px); max-width: 100%; width: auto; object-fit: contain; }
  .alert.ta-left { text-align: left; } .alert.ta-center { text-align: center; } .alert.ta-right { text-align: right; }
  .alert.ta-left .gif { margin-left: 0; } .alert.ta-right .gif { margin-right: 0; }
  .alert .title { font-weight: 800; line-height: 1.2; color: var(--atitle, #fff); font-size: var(--atscale, 1em); }
  .alert.upper .title { text-transform: uppercase; }
  .alert .title b { color: var(--aname, var(--acol)); font-weight: 900; }
  .alert .sub { font-size: .55em; color: var(--asubcol, #d0d0d8); margin-top: .25em; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
  .alert .amsg { font-size: var(--amsgsize, .62em); color: var(--amsgcol, #fff); margin-top: .45em; font-weight: var(--weight, 600); overflow-wrap: anywhere; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes o-fade { to { opacity: 0; } }
  @keyframes o-zoom { to { opacity: 0; transform: scale(.6); } }
  @keyframes o-slide-up { to { opacity: 0; transform: translateY(-80px); } }
  @keyframes o-slide-down { to { opacity: 0; transform: translateY(80px); } }
  @keyframes o-slide-left { to { opacity: 0; transform: translateX(-120%); } }
  @keyframes o-slide-right { to { opacity: 0; transform: translateX(120%); } }
  @keyframes o-blur { to { opacity: 0; filter: blur(14px); } }

  /* ================= WITHER-LEBENSANZEIGE ================= */
  #bars { position: fixed; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 9); padding: calc(var(--px) * 10) calc(var(--px) * 4) calc(var(--px) * 4); font-family: var(--mfont), monospace; }
  #bars.pos-top { top: 0; } #bars.pos-bottom { bottom: 0; flex-direction: column-reverse; } #bars.pos-center { top: 50%; transform: translateY(-50%); }
  .bb { display: flex; flex-direction: column; align-items: center; position: relative; font-family: var(--mfont), monospace; }
  .bb-title { color: var(--btc, #fff); font-size: calc(var(--px) * 8 * var(--bfs, 1)); line-height: 1; margin-bottom: calc(var(--px) * 2); text-shadow: var(--px) var(--px) 0 var(--bts, #3f3f3f); display: flex; align-items: center; gap: calc(var(--px) * 3); white-space: nowrap; }
  .bb-skull { width: calc(var(--px) * 9); height: calc(var(--px) * 9); image-rendering: pixelated; flex: none; }
  .bb-track { position: relative; width: calc(var(--px) * var(--bw, 182)); max-width: 96vw; height: calc(var(--px) * var(--bh, 5)); border-radius: calc(var(--px) * var(--brad, 0)); image-rendering: pixelated; overflow: visible; box-shadow: 0 0 0 var(--px) rgba(0,0,0,.35);
    background: linear-gradient(to bottom, var(--e0) 0 20%, var(--e1) 20% 40%, var(--e2) 40% 60%, var(--e3) 60% 80%, var(--e0) 80% 100%); }
  .bb-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(to bottom, var(--c0) 0 20%, var(--c1) 20% 40%, var(--c2) 40% 60%, var(--c3) 60% 80%, var(--c0) 80% 100%);
    transition: width 1.2s steps(24, end); }
  .bb-notch { position: absolute; inset: calc(var(--px)) 0; pointer-events: none; }
  .bb-ghost { position: absolute; left: 0; top: var(--px); bottom: var(--px); width: 0; background: rgba(255,255,255,.85); transition: width .9s ease-in .45s; }
  .bb-fill { overflow: hidden; }
  .bb-shine { position: absolute; top: 0; bottom: 0; width: calc(var(--px) * 14); left: -20%; display: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: bbshine 3.8s ease-in-out infinite; }
  .bb.shine .bb-shine { display: block; }
  .bb-fill, .bb-ghost, .bb-notch { border-radius: calc(var(--px) * var(--brad, 0)); }
  .bb.noghost .bb-ghost { display: none; }
  /* Original-Minecraft-Texturen (Bossleiste) */
  .bb.st-tex .bb-track { background: none; background-image: var(--tx-bg); background-size: 100% 100%; background-repeat: no-repeat; box-shadow: none; border-radius: 0; }
  .bb.st-tex .bb-fill { background: none; background-image: var(--tx-fg); background-size: calc(var(--px) * var(--bw, 182)) 100%; background-repeat: no-repeat; background-color: var(--tx-tint, transparent); background-blend-mode: multiply; border-radius: 0; }
  .bb.st-tex .bb-notch { display: none; }
  .bb.st-tex .bb-ghost { top: 0; bottom: 0; background: rgba(255,255,255,.55); }
  .mcf { -webkit-text-fill-color: transparent; text-shadow: none !important; display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: middle;
    background-repeat: no-repeat; background-size: 100% 100%; image-rendering: pixelated; }
  .bb-skull.tex { display: inline-block; background-repeat: no-repeat; image-rendering: pixelated; }
  .bb.st-flat .bb-fill { background: var(--c2); }
  .bb.st-grad .bb-fill { background: linear-gradient(90deg, var(--c2), var(--g2)); }
  .bb.st-flat .bb-track, .bb.st-grad .bb-track { background: var(--e2); }
  @keyframes bbshine { 0%, 55% { left: -20%; } 100% { left: 110%; } }
  .bb-armor { position: absolute; inset: 0; display: none; pointer-events: none;
    background: repeating-linear-gradient(135deg, rgba(160,200,255,.0) 0 calc(var(--px) * 3), rgba(160,200,255,.45) calc(var(--px) * 3) calc(var(--px) * 4)); animation: armor 1.2s linear infinite; }
  .bb.armor .bb-armor { display: block; }
  @keyframes armor { to { background-position: calc(var(--px) * 8) 0; } }
  .bb.low .bb-fill { animation: bblow .6s steps(2) infinite; }
  @keyframes bblow { 50% { filter: brightness(2) saturate(.3); } }
  .bb-smoke { position: absolute; bottom: calc(var(--px) * 3); width: calc(var(--px) * 1.5); height: calc(var(--px) * 1.5); pointer-events: none; animation: smoke 1.5s ease-out forwards; }
  @keyframes smoke { from { opacity: .9; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--dx), calc(var(--px) * -12)) scale(1.6); } }
  .bb-title .bb-skull { filter: drop-shadow(var(--px) var(--px) 0 rgba(0,0,0,.45)); }
  .bb.hit .bb-fill { animation: bbhit .6s steps(3) 2; }
  .bb.hurt .bb-track { animation: bbshake .4s steps(4) 2; }
  .bb-float { position: absolute; top: calc(var(--px) * 6); font-size: calc(var(--px) * 8); color: #55ff55; text-shadow: var(--px) var(--px) 0 #153f15; white-space: nowrap; animation: bbfloat 2.2s ease-out forwards; transform: translateX(-50%); }
  @keyframes bbhit { 50% { filter: brightness(2.3) saturate(.6); } }
  @keyframes bbshake { 25% { transform: translateX(calc(var(--px) * -2)); } 75% { transform: translateX(calc(var(--px) * 2)); } }
  @keyframes bbfloat { from { opacity: 0; transform: translate(-50%, 0); } 15% { opacity: 1; } to { opacity: 0; transform: translate(-50%, calc(var(--px) * -22)); } }

  .bb.done .bb-text, .bb.dead .bb-text { color: #ffff55; animation: bbblink .5s steps(2) 6; }
  .bb.dead .bb-track { animation: bbshake .3s steps(4) 6; }
  .bb-float.neg { color: #ff5555; text-shadow: var(--px) var(--px) 0 #3f1515; }
  .xp { position: absolute; bottom: 0; width: calc(var(--px) * 2); height: calc(var(--px) * 2); animation: xpfly 1.4s cubic-bezier(.2,.7,.4,1) both; }
  .bb-extra { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 3); }
  .bb-hype { display: flex; flex-direction: column; align-items: center; color: #ffaa00; font-size: calc(var(--px) * 7); text-shadow: var(--px) var(--px) 0 #3f2a00; }
  .bb-hype.pop { animation: a-pop .5s both; }
  .bb-hype-track { width: calc(var(--px) * 120); height: calc(var(--px) * 3); background: #3f2a00; margin-top: calc(var(--px) * 1.5); }
  .bb-hype-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5500, #ffd000); transition: width .2s linear; }
  .bb-top { color: #ffd54f; font-size: calc(var(--px) * 7); text-shadow: var(--px) var(--px) 0 #3f3515; }
  @keyframes bbblink { 50% { color: #fff; } }
  @keyframes xpfly { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .bb.near .bb-fill { animation: bbnear 1s ease-in-out infinite; }
  .bb.nogoal .bb-fill { transition: width .8s ease; }
  .bb-ticker { color: #e8e8e8; font-size: calc(var(--px) * 7); text-shadow: var(--px) var(--px) 0 #3f3f3f; white-space: nowrap; }
  .bb-ticker.swap { animation: tickin .5s steps(4) both; }
  @keyframes bbnear { 50% { filter: brightness(1.45); } }
  @keyframes tickin { from { opacity: 0; transform: translateY(calc(var(--px) * 3)); } to { opacity: 1; transform: none; } }
  .sub-auth { background: rgba(155,92,255,.1); border: 1px solid rgba(155,92,255,.35); border-radius: 12px; padding: 10px; font-size: 12px; color: var(--text); display: block; line-height: 1.5; }
  .sub-auth a.btn { margin-top: 8px; }
  a.btn { display: table; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; border-radius: 6px; padding: 7px 12px; justify-self: start; }
  /* Chat-Hervorhebungen */
  .msg.first { box-shadow: inset 4px 0 0 #00e676; padding-left: .55em; }
  .msg .tag { display: inline-block; font-size: .62em; font-weight: 800; padding: .1em .45em; border-radius: .4em; margin-right: .35em; vertical-align: .15em; text-shadow: none; color: #0e0e10; }
  .msg .tag.first { background: #00e676; }
  .msg .tag.hl { background: #bf94ff; }
  .msg.hl { background: rgba(117, 94, 188, .55); padding: .3em .55em; }
  .msg.mentioned { background: rgba(255, 70, 70, .35); padding: .3em .55em; }

  /* ================= MINECRAFT-OPTIK ================= */
  .icon-img.px, img.px { image-rendering: pixelated; }
  /* Chat im Minecraft-Stil */
  #chat.theme-mc .msg { background: rgba(0,0,0,.45); border-radius: 0; padding: .08em .35em; }
  #chat.theme-mc .msg .sep { margin-right: .35em; }
  /* Items: Drehen wie fallengelassen, Verzauberungs-Glanz, Inventar-Slot */
  .mc-item { position: relative; display: inline-block; line-height: 0; }
  .mc-item .glint { position: absolute; inset: 0; display: none; pointer-events: none;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    background: linear-gradient(120deg, transparent 0 35%, rgba(190,110,255,.85) 45%, rgba(255,200,255,.9) 50%, rgba(190,110,255,.85) 55%, transparent 65% 100%);
    background-size: 300% 100%; animation: glint 2.6s linear infinite; mix-blend-mode: screen; }
  @keyframes glint { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  .apx { position: fixed; width: var(--s, 6px); height: var(--s, 6px); z-index: 50; pointer-events: none; image-rendering: pixelated;
    animation: apx 1.3s cubic-bezier(.15,.7,.3,1) both; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  @keyframes apx { 0% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 40px)) scale(.4); opacity: 0; } }
  .alert.big { animation-name: var(--ain, a-pop), bigglow !important; animation-duration: var(--adur-in, 600ms), 1.2s !important; animation-iteration-count: 1, infinite !important; }
  @keyframes bigglow { 50% { filter: brightness(1.18) drop-shadow(0 0 .35em var(--acol)); } }

  /* Splash-Text (wie im Minecraft-Hauptmenü) */
  .bb-splash { position: absolute; color: #FFFF55; font-size: calc(var(--px) * 8); text-shadow: var(--px) var(--px) 0 #3f3f00; white-space: nowrap;
    transform: rotate(-18deg); transform-origin: center; animation: splash .55s ease-in-out infinite alternate; pointer-events: none; z-index: 3; }
  @keyframes splash { from { scale: 1; } to { scale: 1.1; } }

  /* ================= QUIZ ================= */
  .qz { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2.5%; font-family: var(--qfont); font-size: var(--q, 28px); color: #fff; }
  .qz[hidden] { display: none; }
  .qz-wrap { display: flex; flex-direction: column; align-items: center; gap: .6em; width: 100%; max-width: 1700px; }
  .qz-title { font-size: 1.5em; font-weight: 800; text-align: center; }
  .qz-board { display: grid; gap: .3em; width: 100%; }
  .qz-cat, .qz-cell { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 2.6em; padding: .25em .35em; overflow-wrap: anywhere; line-height: 1.1; }
  .qz-cat { font-size: .78em; font-weight: 800; min-height: 3.2em; overflow-wrap: normal; word-break: normal; hyphens: auto; -webkit-hyphens: auto; }
  .qz-cell { font-size: 1.35em; font-weight: 900; cursor: pointer; transition: transform .15s; }
  .qz-cell:hover { transform: scale(1.04); }
  .qz-cell.used, .qz-cell.empty { cursor: default; }
  .qz-leader { min-width: 14em; padding: .5em .8em; font-size: .75em; }
  .qz-lh { font-weight: 800; margin-bottom: .3em; text-align: center; }
  .qz-lr { display: flex; justify-content: space-between; gap: 1.2em; }
  .qz-panel { width: min(100%, 1400px); padding: 1.1em 1.4em; display: flex; flex-direction: column; gap: .7em; animation: a-zoom .45s both; text-align: center; }
  .qz-head { display: flex; justify-content: space-between; font-size: .8em; font-weight: 800; opacity: .9; }
  .qz-text { font-size: 1.45em; font-weight: 800; line-height: 1.25; }
  .qz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; text-align: left; }
  .qz-opt { padding: .35em .6em; font-size: .95em; }
  .qz-opt b { margin-right: .4em; }
  .qz-opt.right { outline: .12em solid #55FF55; background: rgba(85,255,85,.25) !important; }
  .qz-hint { font-size: .75em; opacity: .85; }
  .qz-timer { position: relative; height: .7em; }
  .qz-tfill { height: 100%; width: 100%; transition: width .1s linear; }
  .qz-tsec { position: absolute; right: 0; top: -1.3em; font-size: .7em; font-weight: 800; }
  .qz-answer { font-size: 1.5em; font-weight: 900; color: #55FF55; animation: a-pop .5s both; }
  .qz-winner { font-size: 1em; animation: a-bounce .6s .2s both; }
  .qz-winner.none { opacity: .8; }
  .qz-podium { display: flex; justify-content: center; align-items: flex-end; gap: .6em; margin-top: .5em; }
  .qz-pod { display: flex; flex-direction: column; align-items: center; width: 7em; animation: a-slide-up .7s both; }
  .qz-pn { font-weight: 900; font-size: .9em; }
  .qz-pp { font-size: .65em; opacity: .85; margin-bottom: .2em; }
  .qz-pb { width: 100%; display: flex; align-items: flex-start; justify-content: center; font-size: 1.6em; font-weight: 900; padding-top: .2em; }
  .qz-pod.p1 .qz-pb { height: 4.2em; } .qz-pod.p2 .qz-pb { height: 3em; } .qz-pod.p3 .qz-pb { height: 2.2em; }
  .qz-pod.p1 { animation-delay: .5s; } .qz-pod.p2 { animation-delay: .25s; }
  .qz-conf { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 9; animation: conf 3s ease-in both; }
  @keyframes conf { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }

  /* Thema: Minecraft */
  .qz.theme-mc { text-shadow: .09em .09em 0 #3f3f3f; }
  .qz.theme-mc .qz-title { color: #FFFF55; text-shadow: .09em .09em 0 #3f3f00; }
  .qz.theme-mc .qz-cat { background: #8b6a3e; border: .12em solid #3b2a14; box-shadow: inset .1em .1em 0 #b08850, inset -.1em -.1em 0 #5e4527; color: #fff; }
  .qz.theme-mc .qz-cell { background: #6f6f6f; border: .12em solid #000; box-shadow: inset .12em .12em 0 #aaaaaa, inset -.12em -.12em 0 #3c3c3c; color: #FFFF55; text-shadow: .09em .09em 0 #3f3f00; }
  .qz.theme-mc .qz-cell:hover:not(.used):not(.empty) { background: #7d86c5; box-shadow: inset .12em .12em 0 #b3baf0, inset -.12em -.12em 0 #4a5191; }
  .qz.theme-mc .qz-cell.used, .qz.theme-mc .qz-cell.empty { background: #2c2c2c; box-shadow: inset .12em .12em 0 #3a3a3a; }
  .qz.theme-mc .qz-panel, .qz.theme-mc .qz-leader { background: rgba(16,0,16,.94); border: .12em solid; border-image: linear-gradient(#5000ff, #28007f) 1; }
  .qz.theme-mc .qz-head .qz-pts { color: #FFFF55; }
  .qz.theme-mc .qz-opt { background: #6f6f6f; box-shadow: inset .1em .1em 0 #aaaaaa, inset -.1em -.1em 0 #3c3c3c; border: .1em solid #000; }
  .qz.theme-mc .qz-timer { background: #1d3a0f; border: .1em solid #000; }
  .qz.theme-mc .qz-tfill { background: linear-gradient(#b4ff52 0 30%, #80e030 30% 70%, #4fa81c 70%); }
  .qz.theme-mc .qz-hint { color: #AAAAAA; }
  .qz.theme-mc .qz-pb { background: #8b6a3e; border: .12em solid #3b2a14; box-shadow: inset .1em .1em 0 #b08850; }
  .qz.theme-mc .qz-pod.p1 .qz-pb { background: #e8c547; border-color: #6b5410; box-shadow: inset .1em .1em 0 #fff09a; }
  .qz.theme-mc .qz-pod.p2 .qz-pb { background: #c8c8c8; border-color: #555; box-shadow: inset .1em .1em 0 #f0f0f0; }

  /* Thema: TV-Quizshow */
  .qz.theme-show { font-weight: 800; text-shadow: .06em .06em 0 #000; }
  .qz.theme-show .qz-title { color: #ffcc4d; }
  .qz.theme-show .qz-cat { background: #0a1aa8; color: #fff; text-transform: uppercase; border: .08em solid #000; }
  .qz.theme-show .qz-cell { background: #0b1fd4; color: #ffcc4d; border: .08em solid #000; }
  .qz.theme-show .qz-cell.used, .qz.theme-show .qz-cell.empty { background: #071080; }

// Liefert den CSS-Font-Stack und lädt die Schrift bei Bedarf
function fontStack(name, fileUrl) {
  name = (name || 'Inter').trim();
  if (name === 'Minecraft (Original)') name = 'Minecraft';   // Ersatz, bis die Originalschrift geladen ist
  if (name === 'Eigene Schriftdatei') {
    if (!fileUrl) return "'Pixelify Sans', monospace";
    if (!loadedFonts.has('custom')) { loadedFonts.add('custom'); addCss(`@font-face { font-family: 'TCO Custom'; src: url("${String(fileUrl).replace(/"/g, '%22')}"); font-display: swap; }`); }
    return "'TCO Custom', 'Pixelify Sans', monospace";
  }
  if (name === 'Minecraft') {
    if (!loadedFonts.has('mc')) {
      loadedFonts.add('mc');
      // Mehrere Quellen – die erste, die lädt, wird genutzt
      addLink('https://fonts.cdnfonts.com/css/minecraft-4');
      addLink('https://fonts.cdnfonts.com/css/minecraftia');
      addCss(`@font-face { font-family: 'Monocraft'; font-display: swap; src:

    }
    return "'Minecraft', 'Minecraftia', 'Monocraft', 'Pixelify Sans', monospace";
  }
  if (SYSTEM_FONTS.includes(name)) return `'${name}', sans-serif`;
  if (!loadedFonts.has(name)) {

    const fam = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+');
    addLink(fam + '&display=swap');

const MC_COLORS = { 0: '#000000', 1: '#0000AA', 2: '#00AA00', 3: '#00AAAA', 4: '#AA0000', 5: '#AA00AA', 6: '#FFAA00', 7: '#AAAAAA', 8: '#555555', 9: '#5555FF', a: '#55FF55', b: '#55FFFF', c: '#FF5555', d: '#FF55FF', e: '#FFFF55', f: '#FFFFFF' };
// Wandelt Text mit Minecraft-Codes in HTML um. style wird über mehrere Aufrufe weitergereicht.
function mcFormat(raw, style) {
  let out = '';
  for (const part of raw.split(/([&§][0-9a-fk-or])/i)) {
    const m = /^[&§]([0-9a-fk-or])$/i.exec(part);
    if (m) {
      const c = m[1].toLowerCase();
      if (MC_COLORS[c]) { style.color = MC_COLORS[c]; style.k = style.l = style.m = style.n = style.o = false; }
      else if (c === 'r') { style.color = null; style.k = style.l = style.m = style.n = style.o = false; }
      else style[c] = true;
      continue;
    }
    if (!part) continue;
    const css = [style.color && `color:${style.color}`, style.l && 'font-weight:900', style.o && 'font-style:italic',
      (style.n || style.m) && `text-decoration:${[style.n && 'underline', style.m && 'line-through'].filter(Boolean).join(' ')}`].filter(Boolean).join(';');
    const txt = esc(part);
    out += css || style.k ? `<span${style.k ? ' class="mc-k"' : ''}${css ? ` style="${css}"` : ''}>${txt}</span>` : txt;
  }
  return out;
}

const mcIconCache = {};
function mcIcon(name) {
  if (mcIconCache[name]) return mcIconCache[name];
  const ic = MC_ICONS[name];
  if (!ic) return '';
  const h = ic.g.length, w = Math.max(...ic.g.map(r => r.length));
  const filled = (x, y) => y >= 0 && y < h && x >= 0 && x < w && !!ic.p[ic.g[y][x]];
  let r = '';
  // automatischer Rand
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++)
    if (!filled(x, y) && (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1))) r += `<rect x="${x + 1}" y="${y + 1}" width="1" height="1" fill="${ic.o}"/>`;
  ic.g.forEach((row, y) => [...row].forEach((c, x) => { if (ic.p[c]) r += `<rect x="${x + 1}" y="${y + 1}" width="1" height="1" fill="${ic.p[c]}"/>`; }));
  const S = Math.max(w, h) + 2, ox = (S - w - 2) / 2, oy = (S - h - 2) / 2;
  return (mcIconCache[name] = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-ox} ${-oy} ${S} ${S}" shape-rendering="crispEdges">${r}</svg>`));
}

/* ---------- Config <-> URL ---------- */
function readConfig() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return null;
  const p = new URLSearchParams(h);
  const cfg = { ...DEFAULTS };
  for (const k of Object.keys(DEFAULTS)) {
    if (!p.has(k)) continue;
    const v = p.get(k), d = DEFAULTS[k];
    cfg[k] = typeof d === 'boolean' ? v === '1' : typeof d === 'number' ? Number(v) : v;
  }
  const legacy = {};
  for (const [k, d] of Object.entries(LEGACY)) {
    if (!p.has(k) || k in DEFAULTS) continue;
    const v = p.get(k);
    legacy[k] = typeof d === 'boolean' ? v === '1' : typeof d === 'number' ? Number(v) : v;
  }
  applyLegacy(cfg, legacy, new Set(p.keys()));
  cfg.demo = p.get('demo') === '1';
  cfg.mode = p.get('mode') || 'chat';
  return cfg;
}
function configToHash(cfg, mode, extra = {}) {
  const p = new URLSearchParams();
  if (mode && mode !== 'chat') p.set('mode', mode);
  for (const k of Object.keys(DEFAULTS)) {
    const g = keyGroup(k);
    if (!(g === 'common' || g === mode || (g === 'secret' && mode !== 'chat'))) continue;
    const v = cfg[k];
    if (v === DEFAULTS[k] && k !== 'channel') continue;
    p.set(k, typeof v === 'boolean' ? (v ? '1' : '0') : String(v));
  }
  for (const [k, v] of Object.entries(extra)) p.set(k, v);
  return p.toString();
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function splitList(s) { return String(s || '').toLowerCase().split(/[\s,;]+/).filter(Boolean); }
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
async function getJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); } catch { return null; }
}

/* ---------- Emotes & Badges ---------- */
function createEmoteEngine(cfg) {
  const emotes = new Map();   // name -> {url, zw}
  const badges = {};          // "set/version" -> url
  let roomId = null;
  const BTTV_ZW = new Set(['SoSnowy','IceCold','SantaHat','TopHat','ReinDeer','CandyCane','cvMask','cvHazmat']);

  function add7tv(list) {
    for (const e of list || []) {
      const host = e.data && e.data.host;
      if (!host) continue;
      const files = (host.files || []).filter(f => /webp$/i.test(f.name));
      const pick = files.find(f => f.name.startsWith('2x')) || files[0] || { name: '2x.webp' };
      const zw = ((e.flags || 0) & 1) === 1 || ((e.data.flags || 0) & 256) === 256;
      emotes.set(e.name, { url: 'https:' + host.url + '/' + pick.name, zw });
    }
  }
  function addBttv(list) { for (const e of list || []) emotes.set(e.code, { url: `https://cdn.betterttv.net/emote/${e.id}/2x`, zw: BTTV_ZW.has(e.code) }); }
  function addFfz(list) {
    for (const e of list || []) {
      const im = e.images || {};
      const url = im['2x'] || im['1x'] || im['4x'];
      if (url) emotes.set(e.code, { url, zw: false });
    }
  }
  async function load() {
    const want = (on, url) => on ? getJSON(url) : Promise.resolve(null);
    const [ffzG, bttvG, stvG, ffzC, bttvC, stvC] = await Promise.all([
      want(cfg.effz, 'https://api.betterttv.net/3/cached/frankerfacez/emotes/global'),
      want(cfg.ebttv, 'https://api.betterttv.net/3/cached/emotes/global'),
      want(cfg.e7tv, 'https://7tv.io/v3/emote-sets/global'),
      want(cfg.effz && roomId, 'https://api.betterttv.net/3/cached/frankerfacez/users/twitch/' + roomId),
      want(cfg.ebttv && roomId, 'https://api.betterttv.net/3/cached/users/twitch/' + roomId),
      want(cfg.e7tv && roomId, 'https://7tv.io/v3/users/twitch/' + roomId),
    ]);
    emotes.clear();
    // Reihenfolge: FFZ < BTTV < 7TV (spätere überschreiben gleichnamige)
    if (Array.isArray(ffzG)) addFfz(ffzG);
    if (Array.isArray(ffzC)) addFfz(ffzC);
    if (Array.isArray(bttvG)) addBttv(bttvG);
    if (bttvC) { addBttv(bttvC.channelEmotes); addBttv(bttvC.sharedEmotes); }
    if (stvG) add7tv(stvG.emotes);
    if (stvC && stvC.emote_set) add7tv(stvC.emote_set.emotes);
    console.log('[overlay] Emotes geladen:', emotes.size);
  }
  function addBadgeSets(data) {
    const list = Array.isArray(data) ? data : (data && (data.data || data.badge_sets)) || [];
    for (const set of list) for (const v of set.versions || []) {
      const url = v.image_url_2x || v.image_url_4x || v.image_url_1x;
      if (url) badges[set.set_id + '/' + v.id] = url;
    }
  }
  async function loadBadges() {
    addBadgeSets(await getJSON('https://api.ivr.fi/v2/twitch/badges/global'));
    if (cfg.channel) addBadgeSets(await getJSON('https://api.ivr.fi/v2/twitch/badges/channel?login=' + encodeURIComponent(cfg.channel)));
  }
  function setRoom(id) { if (id && id !== roomId) { roomId = id; load(); } }

  const FALLBACK_BADGE = {
    broadcaster: ['#e91916', 'B'], moderator: ['#00ad03', 'M'], vip: ['#e005b9', 'V'],
    subscriber: ['#8205b4', 'S'], founder: ['#8205b4', 'F'], partner: ['#9146ff', '✓'],
    staff: ['#000', 'S'], 'bot-badge': ['#555', 'BOT'],
  };
  function badgeAllowed(set) {
    if (set === 'broadcaster') return cfg.bBroadcaster;
    if (set === 'moderator' || set === 'lead_moderator') return cfg.bMod;
    if (set === 'vip') return cfg.bVip;
    if (set === 'subscriber' || set === 'founder') return cfg.bSub;
    return cfg.bOther;
  }
  function renderBadges(tag) {
    if (!tag) return '';
    let out = '';
    for (const b of tag.split(',')) {
      if (!b) continue;
      const set = b.split('/')[0];
      if (!badgeAllowed(set)) continue;
      if (badges[b]) out += `<img class="badge" src="${esc(badges[b])}" alt="">`;
      else if (FALLBACK_BADGE[set]) out += `<span class="fbadge" style="background:${FALLBACK_BADGE[set][0]}">${FALLBACK_BADGE[set][1]}</span>`;
    }
    return out ? `<span class="badges">${out}</span>` : '';
  }

  function renderText(text, emoteTag, stripCheers = false, mc = false) {
    const mcStyle = {};
    // 1) Twitch-Emotes anhand der Positionen (Unicode-Zeichen)
    const chars = Array.from(text || '');
    const ranges = [];
    if (emoteTag) {
      for (const part of emoteTag.split('/')) {
        const [id, pos] = part.split(':');
        if (!pos) continue;
        for (const r of pos.split(',')) { const [a, b] = r.split('-').map(Number); ranges.push({ a, b, id }); }
      }
      ranges.sort((x, y) => x.a - y.a);
    }
    const tokens = [];
    let i = 0;
    for (const r of ranges) {
      if (r.a < i) continue;
      if (r.a > i) tokens.push({ type: 'text', v: chars.slice(i, r.a).join('') });
      tokens.push({ type: 'emote', url: `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/2.0`, name: chars.slice(r.a, r.b + 1).join(''), zw: false });
      i = r.b + 1;
    }
    if (i < chars.length) tokens.push({ type: 'text', v: chars.slice(i).join('') });

    // 2) 7TV / BTTV / FFZ in den Textteilen
    const out = [];
    for (const t of tokens) {
      if (t.type !== 'text') { out.push(t); continue; }
      for (const w of t.v.split(/(\s+)/)) {
        if (!w) continue;
        if (stripCheers && CHEER_RE.test(w)) continue;
        const e = emotes.get(w);
        out.push(e ? { type: 'emote', url: e.url, zw: e.zw, name: w } : { type: 'text', v: w });
      }
    }

    // 3) HTML bauen; Zero-Width-Emotes über das vorherige Emote legen
    const parts = [];
    let lastWrap = -1, emoteCount = 0, textOnly = true;
    for (const t of out) {
      if (t.type === 'emote') {
        const img = `<img class="emote" src="${esc(t.url)}" alt="${esc(t.name)}">`;
        if (t.zw && lastWrap >= 0) { parts[lastWrap].imgs.push(img); continue; }
        parts.push({ kind: 'emote', imgs: [img] });
        lastWrap = parts.length - 1; emoteCount++;
      } else if (/^\s+$/.test(t.v)) {
        parts.push({ kind: 'text', v: t.v });
      } else {
        textOnly = false; lastWrap = -1;
        let v = mc ? mcFormat(t.v, mcStyle) : esc(t.v);
        if (/^@\w+/.test(t.v)) v = `<span class="mention">${v}</span>`;
        parts.push({ kind: 'text', v });
      }
    }
    const html = parts.map(p => p.kind === 'emote' ? `<span class="emote-wrap">${p.imgs.join('')}</span>` : p.v).join('').trim();
    return { html, onlyEmotes: emoteCount > 0 && textOnly };
  }

  return { load, loadBadges, setRoom, renderText, renderBadges, emotes };
}
const CHEER_RE = /^(cheer|cheerwhal|biblethump|corgo|uni|showlove|party|seemsgood|pride|kappa|frankerz|heyguys|dansgame|elegiggle|trihard|kreygasm|4head|swiftrage|notlikethis|failfish|vohiyo|pjsalt|mrdestructoid|bday|ripcheer|shamrock|doodlecheer|bitboss|streamlabs|muxy|holidaycheer|goal|anon|charity)\d+$/i;

/* ---------- Twitch-Chat (anonym, kein Login nötig) ---------- */
function parseIRC(line) {
  const msg = { tags: {}, prefix: '', command: '', params: [] };
  let pos = 0;
  if (line[0] === '@') {
    const sp = line.indexOf(' ');
    for (const kv of line.slice(1, sp).split(';')) {
      const eq = kv.indexOf('=');
      msg.tags[kv.slice(0, eq)] = kv.slice(eq + 1).replace(/\\s/g, ' ').replace(/\\:/g, ';').replace(/\\\\/g, '\\').replace(/\\r/g, '\r').replace(/\\n/g, '\n');
    }
    pos = sp + 1;
  }
  if (line[pos] === ':') { const sp = line.indexOf(' ', pos); msg.prefix = line.slice(pos + 1, sp); pos = sp + 1; }
  const rest = line.slice(pos);
  const ti = rest.indexOf(' :');
  const head = ti >= 0 ? rest.slice(0, ti) : rest;
  const parts = head.split(' ').filter(Boolean);
  msg.command = parts.shift();
  msg.params = parts;
  if (ti >= 0) msg.params.push(rest.slice(ti + 2));
  msg.login = msg.prefix.split('!')[0];
  return msg;
}
function connectIRC(channel, onMsg) {
  let ws, backoff = 1000;
  (function connect() {
    ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      backoff = 1000;
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      ws.send('JOIN #' + channel.toLowerCase().replace(/^#/, ''));
    };
    ws.onmessage = ev => {
      for (const line of ev.data.split('\r\n')) {
        if (!line) continue;
        const m = parseIRC(line);
        if (m.command === 'PING') ws.send('PONG :' + (m.params[0] || 'tmi.twitch.tv'));
        else if (m.command === 'RECONNECT') ws.close();
        else onMsg(m);
      }
    };
    ws.onclose = () => { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 30000); };
  })();
}

/* ---------- Twitch-Events (Subs, Gifts, Raids, Bits) erkennen ---------- */
function tierName(plan) { return plan === 'Prime' ? 'Prime' : plan === '2000' ? 'Stufe 2' : plan === '3000' ? 'Stufe 3' : 'Stufe 1'; }
function createEventParser() {
  const pendingGifts = {}; // gifter -> Anzahl Einzel-Gifts, die zu einem Massengift gehören
  return function parse(m) {
    const t = m.tags;
    const name = t['display-name'] || t.login || m.login;
    const text = m.params[1] || '';
    if (m.command === 'PRIVMSG' && t.bits) {
      return { kind: 'bits', name, amount: Number(t.bits), message: text, emotes: t.emotes, badges: t.badges };
    }
    if (m.command !== 'USERNOTICE') return null;
    const id = t['msg-id'];
    const months = Number(t['msg-param-cumulative-months'] || 0);
    const plan = t['msg-param-sub-plan'] || '1000';
    const tier = tierName(plan);
    switch (id) {
      case 'sub': return { kind: 'sub', name, tier, plan, months: 1, message: text, emotes: t.emotes };
      case 'resub': return { kind: months > 1 ? 'resub' : 'sub', name, tier, plan, months, message: text, emotes: t.emotes };
      case 'submysterygift': {
        const n = Number(t['msg-param-mass-gift-count'] || 1);
        pendingGifts[(t.login || '').toLowerCase()] = (pendingGifts[(t.login || '').toLowerCase()] || 0) + n;
        return { kind: 'mass', name, amount: n, tier, plan };
      }
      case 'subgift': case 'anonsubgift': {
        const g = (t.login || '').toLowerCase();
        if (pendingGifts[g] > 0) { pendingGifts[g]--; return null; } // gehört zu einem Massengift
        return { kind: 'gift', name: id === 'anonsubgift' ? 'Anonym' : name, recipient: t['msg-param-recipient-display-name'], tier, plan };
      }
      case 'giftpaidupgrade': case 'primepaidupgrade':
        return { kind: 'sub', name, tier, plan, months: 1, message: text, emotes: t.emotes };
      case 'raid':
        return { kind: 'raid', name: t['msg-param-displayName'] || name, viewers: Number(t['msg-param-viewerCount'] || 0) };
      case 'announcement':
        return { kind: 'announce', name, message: text, emotes: t.emotes };
    }
    return null;
  };
}

/* ---------- Texte für Events ---------- */
function eventTexts(ev, cfg) {
  const st = EVENT_STYLE[ev.kind] || EVENT_STYLE.popup;
  const amount = ev.kind === 'tip' ? formatMoney(ev.amount, ev.currency) : ev.amount;
  const tpl = {
    sub: cfg.tSub, resub: cfg.tResub, gift: cfg.tGift, mass: cfg.tMass, raid: cfg.tRaid,
    bits: cfg.tBits, follow: cfg.tFollow, tip: cfg.tTip, announce: '{name}',
  }[ev.kind];
  let title;
  if (ev.kind === 'popup') title = cfg.mcCodes && hasMcCodes(ev.title) ? mcFormat(ev.title, {}) : esc(ev.title || '');
  else title = esc(tpl || '{name}').replace(/\{(\w+)\}/g, (_, k) => {
    const v = { name: ev.name, amount, months: ev.months, recipient: ev.recipient, viewers: ev.viewers, tier: ev.tier }[k];
    return k === 'name' ? `<b>${esc(v)}</b>` : `<b>${esc(v ?? '')}</b>`;
  });
  let sub = st.label;
  if (ev.kind === 'sub' || ev.kind === 'resub' || ev.kind === 'gift' || ev.kind === 'mass') sub = st.label + ' · ' + (ev.tier || 'Stufe 1');
  if (ev.kind === 'popup') sub = ev.by ? 'von ' + ev.by : '';
  return { icon: cfg['i_' + ev.kind] ?? st.icon, color: cfg['c_' + ev.kind] || st.color, title, sub };
}
function formatMoney(a, cur) {
  try { return new Intl.NumberFormat('de-DE', { style: 'currency', currency: (cur || 'EUR').toUpperCase() }).format(Number(a)); }
  catch { return a + ' ' + (cur || ''); }
}

/* =====================================================================
   CHAT-OVERLAY
   ===================================================================== */
function startChat(cfg) {
  document.body.className = 'overlay';
  const chat = document.createElement('div');
  chat.id = 'chat';
  if (cfg.direction === 'top') chat.classList.add('top');
  chat.classList.add('theme-' + cfg.cTheme);
  document.body.appendChild(chat);
  applyFont(chat, cfg);
  const s = chat.style;
  s.setProperty('--size', cfg.size + 'px');
  s.setProperty('--gap', cfg.gap + 'px');
  s.setProperty('--pad', cfg.pad + 'px');
  s.setProperty('--dur', cfg.dur + 'ms');
  s.setProperty('--radius', cfg.radius + 'px');
  if (cfg.bg !== 'none') { s.setProperty('--mbg', hexA(cfg.bgColor, cfg.bgAlpha / 100)); s.setProperty('--mpad', '.35em .6em'); }

  const bots = new Set(splitList(cfg.botList));
  const hidden = new Set(splitList(cfg.hideUsers));
  const E = createEmoteEngine(cfg);
  const parseEvent = createEventParser();

  function nameColor(tags) {
    if (cfg.nameColor === 'fixed') return cfg.fixedNameColor;
    if (cfg.nameColor === 'text') return cfg.color;
    if (tags.color) return tags.color;
    const pal = ['#FF0000','#0000FF','#008000','#B22222','#FF7F50','#9ACD32','#FF4500','#2E8B57','#DAA520','#D2691E','#5F9EA0','#1E90FF','#FF69B4','#8A2BE2','#00FF7F'];
    let h = 0; for (const c of tags['display-name'] || '') h = (h * 31 + c.charCodeAt(0)) | 0;
    return pal[Math.abs(h) % pal.length];
  }

  function place(el) {
    if (cfg.anim !== 'none') el.style.animationName = 'a-' + cfg.anim;
    if (cfg.direction === 'top') chat.prepend(el); else chat.appendChild(el);
    const all = chat.querySelectorAll('.msg:not(.removing)');
    if (all.length > cfg.maxMsgs) {
      const victims = cfg.direction === 'top' ? Array.from(all).slice(cfg.maxMsgs) : Array.from(all).slice(0, all.length - cfg.maxMsgs);
      victims.forEach(v => v.remove());
    }
    if (cfg.fadeAfter > 0) setTimeout(() => removeEl(el), cfg.fadeAfter * 1000);
    requestAnimationFrame(() => {
      if (cfg.direction === 'top') {
        while (chat.children.length > 1 && chat.lastElementChild.offsetTop + chat.lastElementChild.offsetHeight > chat.clientHeight) chat.lastElementChild.remove();
      } else {
        while (chat.children.length > 1 && chat.firstElementChild.offsetTop < 0) chat.firstElementChild.remove();
      }
    });
  }
  function removeEl(el) {
    if (!el.isConnected) return;
    el.classList.add('removing');
    setTimeout(() => el.remove(), 500);
  }

  function addMessage(tags, login, text) {
    login = (login || '').toLowerCase();
    if (cfg.hideBots && bots.has(login)) return;
    if (hidden.has(login)) return;
    if (cfg.hideBots && /(^|,)bot-badge\//.test(tags.badges || '')) return;
    let action = false;
    const m = /^\u0001ACTION (.*)\u0001$/.exec(text);
    if (m) { action = true; text = m[1]; }
    if (cfg.hideCmds && text.startsWith('!')) return;
    if (cfg.hideLinks && /https?:\/\/|www\./i.test(text)) return;

    const { html, onlyEmotes } = E.renderText(text, tags.emotes, false, cfg.mcCodes);
    const color = nameColor(tags);
    const mcTheme = cfg.cTheme === 'mc';
    const first = cfg.cFirst && tags['first-msg'] === '1';
    const hl = cfg.cHighlight && tags['msg-id'] === 'highlighted-message';
    const mentioned = cfg.cMention && cfg.channel && login !== cfg.channel.toLowerCase() && new RegExp('(^|\\W)@?' + cfg.channel + '\\b', 'i').test(text);
    const el = document.createElement('div');
    el.className = 'msg' + (action ? ' action' : '') + (cfg.layout === 'block' ? ' block' : '') + (cfg.bigEmotes && onlyEmotes ? ' big-emotes' : '') + (first ? ' first' : '') + (hl ? ' hl' : '') + (mentioned ? ' mentioned' : '');
    if (tags.id) el.dataset.id = tags.id;
    el.dataset.user = login;
    el.innerHTML =
      `<span class="meta">${first ? '<span class="tag first">NEU HIER</span>' : ''}${hl ? '<span class="tag hl">★</span>' : ''}${E.renderBadges(tags.badges)}<span class="name" style="color:${esc(color)}">${mcTheme ? '&lt;' : ''}${esc(tags['display-name'] || login)}${mcTheme ? '&gt;' : ''}</span><span class="sep">${action || mcTheme ? '' : ':'}</span></span>` +
      `<span class="text"${action ? ` style="color:${esc(color)}"` : ''}>${html}</span>`;
    place(el);
  }

  function addEvent(ev, tags) {
    const tx = eventTexts(ev, { ...cfg, ...DEFAULTS_TEXTS });
    const el = document.createElement('div');
    el.className = 'msg event';
    el.style.setProperty('--ecol', tx.color);
    el.style.background = `linear-gradient(90deg, ${hexA(tx.color, .45)}, ${hexA(tx.color, .1)})`;
    const msg = ev.message ? E.renderText(ev.message, ev.emotes, ev.kind === 'bits').html : '';
    el.innerHTML = `<span class="etitle">${tx.icon} ${tx.title}</span>${msg ? `<span class="emsg">${msg}</span>` : ''}`;
    if (tags && tags.id) el.dataset.id = tags.id;
    place(el);
  }

  function handle(m) {
    switch (m.command) {
      case 'ROOMSTATE': E.setRoom(m.tags['room-id']); break;
      case 'PRIVMSG': {
        const ev = cfg.cEvents ? parseEvent(m) : null;
        if (ev) addEvent(ev, m.tags); else addMessage(m.tags, m.login, m.params[1] || '');
        break;
      }
      case 'USERNOTICE': {
        if (!cfg.cEvents) break;
        const ev = parseEvent(m);
        if (ev) addEvent(ev, m.tags);
        break;
      }
      case 'CLEARMSG':
        if (cfg.removeDeleted) { const el = chat.querySelector(`.msg[data-id="${CSS.escape(m.tags['target-msg-id'] || '')}"]`); if (el) removeEl(el); }
        break;
      case 'CLEARCHAT':
        if (cfg.removeDeleted) {
          const user = m.params[1];
          chat.querySelectorAll(user ? `.msg[data-user="${CSS.escape(user.toLowerCase())}"]` : '.msg').forEach(removeEl);
        }
        break;
    }
  }

  E.loadBadges();
  E.load();
  setInterval(E.load, 5 * 60 * 1000); // neue Emotes alle 5 Min. übernehmen
  if (cfg.channel) connectIRC(cfg.channel, handle);
  if (cfg.demo) runDemoChat(handle, E.emotes);
}
// Im Chat werden immer die Standardtexte genutzt (die Alert-Texte stehen nur in der Alert-URL)
const DEFAULTS_TEXTS = Object.fromEntries(Object.entries(DEFAULTS).filter(([k]) => /^t[A-Z]/.test(k)));

/* =====================================================================
   SPENDEN-DIENSTE (StreamElements / Streamlabs)
   ===================================================================== */
function connectSE(token, push) {
  let ws, backoff = 2000;
  (function connect() {
    ws = new WebSocket('wss://astro.streamelements.com');
    ws.onopen = () => {
      backoff = 2000;
      ws.send(JSON.stringify({ type: 'subscribe', nonce: String(Date.now()), data: { topic: 'channel.activities', token, token_type: 'jwt' } }));
    };
    ws.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch { return; }
      if (d.type === 'response' && d.error) console.warn('[StreamElements]', d.error, d.data && d.data.message);
      if (d.type !== 'message' || !d.data) return;
      const a = d.data, x = a.data || {};
      const name = x.displayName || x.username || x.name || 'Jemand';
      if (a.type === 'tip') push({ kind: 'tip', name, amount: x.amount, currency: x.currency, message: x.message });
      else if (a.type === 'follower' || a.type === 'follow') push({ kind: 'follow', name });
      else if (a.type === 'merch') push({ kind: 'popup', title: `${name} hat Merch gekauft!`, by: '' });
    };
    ws.onclose = () => { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 60000); };
  })();
}
async function connectSL(token, push) {
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.min.js'); }
  catch { console.warn('[Streamlabs] socket.io konnte nicht geladen werden'); return; }
  const sock = window.io('https://sockets.streamlabs.com?token=' + encodeURIComponent(token), { transports: ['websocket'] });
  sock.on('event', e => {
    const list = Array.isArray(e.message) ? e.message : [e.message || {}];
    for (const x of list) {
      if (e.type === 'donation') push({ kind: 'tip', name: x.from || x.name || 'Jemand', amount: x.amount, currency: x.currency, message: x.message });
      else if (e.type === 'follow' && (!e.for || e.for === 'twitch_account')) push({ kind: 'follow', name: x.name });
    }
  });
}
function isStaff(tags) { return /(^|,)(broadcaster|moderator|lead_moderator)\//.test(tags.badges || ''); }
function isImageLike(v) { return /^(https?:|file:|data:)/i.test(v) || /\.(png|gif|webp|jpe?g|svg|avif)(\?.*)?$/i.test(v); }
function iconHtml(v) {
  if (/^mc:/.test(v)) { const u = mcIcon(v.slice(3)); return u ? `<span class="mc-item"><img class="icon-img px" src="${u}" alt=""><i class="glint" style="-webkit-mask-image:url('${u}');mask-image:url('${u}')"></i></span>` : ''; }
  return isImageLike(v) ? `<img class="icon-img" src="${esc(v)}" alt="">` : esc(v);
}

/* =====================================================================
   ALERT-OVERLAY
   ===================================================================== */
function startAlerts(cfg) {
  document.body.className = 'overlay';
  if (ALERTS_PAUSED && !cfg.demo) return;
  const box = document.createElement('div');
  box.id = 'alerts';
  document.body.appendChild(box);
  applyFont(box, cfg);

  // Design des jeweiligen Alert-Typs
  const typeCfg = kind => Object.fromEntries(ALERT_KEYS.map(K => [K, cfg[K + '_' + kind] ?? ALERT_DESIGN[K]]));
  function styleAlert(el, c) {
    const s = el.style;
    s.setProperty('--asize', c.aSize + 'px');
    s.setProperty('--agif', c.aGifH + 'px');
    s.setProperty('--atitle', c.aTitleColor);
    s.setProperty('--atscale', (c.aTitleScale / 100) + 'em');
    if (c.aNameMode === 'custom') s.setProperty('--aname', c.aNameColor);
    s.setProperty('--asubcol', c.aSubColor);
    s.setProperty('--amsgcol', c.aMsgColor);
    s.setProperty('--amsgsize', (c.aMsgScale / 100) + 'em');
    if (c.aFont) s.setProperty('--font', fontStack(c.aFont, cfg.fontFile));
    if (c.aWeight) { s.setProperty('--weight', c.aWeight); s.setProperty('--nweight', c.aWeight); }
    if (c.aShadow) s.setProperty('--shadow', SHADOWS[c.aShadow] || 'none');
  }
  if (cfg.aCss) { const st = document.createElement('style'); st.textContent = cfg.aCss; document.head.appendChild(st); }

  const E = createEmoteEngine(cfg);
  const parseEvent = createEventParser();
  const queue = [];
  const seen = new Set();
  let busy = false;

  function enabled(ev) {
    switch (ev.kind) {
      case 'sub': case 'resub': return cfg.aSub;
      case 'gift': case 'mass': return cfg.aGift;
      case 'raid': return cfg.aRaid;
      case 'bits': return cfg.aBits && ev.amount >= cfg.aBitsMin;
      case 'follow': return cfg.aFollow;
      case 'tip': return cfg.aTip && Number(ev.amount) >= cfg.aTipMin;
      case 'announce': return cfg.aAnnounce;
      case 'popup': return cfg.aPopup;
    }
    return false;
  }
  let paused = false, current = null, lastEv = null;
  const bad = splitList(cfg.aBadWords);
  function censor(t) {
    if (!t || !bad.length) return t;
    return bad.reduce((x, w) => x.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '***'), t);
  }
  function speak(ev) {
    if (!cfg.aTts || !ev.message || !window.speechSynthesis) return;
    const c = typeCfg(ev.kind);
    const ok = (ev.kind === 'tip' && Number(ev.amount) >= cfg.aTtsMin) || (ev.kind === 'bits' && ev.amount >= cfg.aTtsBits) || (cfg.aTtsSubs && (ev.kind === 'resub' || ev.kind === 'sub'));
    if (!ok) return;
    const text = ev.message.split(/\s+/).filter(w => !CHEER_RE.test(w) && !E.emotes.has(w)).join(' ').trim();
    if (!text) return;
    const u = new SpeechSynthesisUtterance((cfg.aTtsName ? ev.name + ' sagt: ' : '') + text);
    u.lang = cfg.aTtsLang; u.rate = cfg.aTtsRate; u.volume = c.aVolume / 100;
    setTimeout(() => speechSynthesis.speak(u), 1200);
  }
  function push(ev) {
    if (!ev || !enabled(ev)) return;
    if (ev.kind === 'follow') { // doppelte Follows ignorieren
      const k = 'f:' + (ev.name || '').toLowerCase();
      if (seen.has(k)) return; seen.add(k);
    }
    queue.push(ev);
    if (!busy && !paused) next();
  }

  function next() {
    if (paused) { busy = false; return; }
    const ev = queue.shift();
    if (!ev) { busy = false; return; }
    busy = true;
    lastEv = ev;
    ev.message = censor(ev.message);
    if (ev.title) ev.title = censor(ev.title);
    const tx = eventTexts(ev, cfg);
    const c = typeCfg(ev.kind);
    box.classList.remove('pos-top', 'pos-center', 'pos-bottom', 'al-left', 'al-right');
    box.classList.add('pos-' + c.aPos);
    if (c.aAlign !== 'center') box.classList.add('al-' + c.aAlign);
    const big = cfg.aBig && ((ev.kind === 'mass' && ev.amount >= 5) || ev.kind === 'raid' || (ev.kind === 'tip' && Number(ev.amount) >= cfg.aBigTip) || (ev.kind === 'bits' && ev.amount >= 1000));
    const col = tx.color;
    const el = document.createElement('div');
    el.className = `alert ta-${c.aAlign} t-${ev.kind}` + (c.aUpper ? ' upper' : '') + (big ? ' big' : '');
    styleAlert(el, c);
    el.style.setProperty('--acol', col);
    el.style.setProperty('--ain', 'a-' + c.aAnim);
    el.style.setProperty('--alen', c.aLen + 's');
    const gif = String(cfg['g_' + ev.kind] || '').trim();
    const msg = c.aMsgShow && ev.message ? E.renderText(ev.message, ev.emotes, ev.kind === 'bits', cfg.mcCodes).html : '';
    el.innerHTML =
      (gif ? `<div class="gif"><img src="${esc(gif)}" alt=""></div>` : '') +
      `<div class="txt"><div class="title">${tx.title}</div>` +
      (c.aSubShow && tx.sub ? `<div class="sub">${esc(tx.sub)}</div>` : '') +
      (msg ? `<div class="amsg">${msg}</div>` : '') + `</div>`;
    box.appendChild(el);
    if (c.aParticles) setTimeout(() => particles(el, col, big, c), 250);
    if (big && !cfg['s_' + ev.kind] && c.aSound !== 'none') fanfare(c); else playSound(c, cfg['s_' + ev.kind]);
    speak(ev);
    let done = false;
    const finish = () => {
      if (done) return; done = true; clearTimeout(timer);
      el.classList.remove('big');
      el.style.animation = `o-${c.aOut} 500ms ease-in both`;
      setTimeout(() => { el.remove(); current = null; setTimeout(next, 400); }, 500);
    };
    const timer = setTimeout(finish, c.aLen * 1000);
    current = { finish };
  }

  /* --- Pixel-Partikel rund ums Icon --- */
  function particles(el, col, big, c) {
    const anchor = el.querySelector('.gif') || el;
    const r = anchor.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = [col, '#ffffff', '#ffd54f'];
    const n = big ? 46 : 22;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'apx';
      const ang = Math.random() * Math.PI * 2, dist = (big ? 140 : 80) + Math.random() * (big ? 160 : 70);
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.background = cols[i % cols.length];
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist - 30 + 'px');
      p.style.setProperty('--s', (big ? 7 : 5) + Math.floor(Math.random() * 4) + 'px');
      p.style.animationDelay = Math.random() * .25 + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1700);
    }
  }
  // „Aufgabe gemeistert“-Fanfare für große Events
  function fanfare(c) {
    const vol = c.aVolume / 100;
    if (vol <= 0) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      [[523, 0, .18], [659, .14, .18], [784, .28, .18], [1047, .42, .5], [988, .62, .14], [1047, .76, .7]].forEach(([f, d, len]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = f;
        const t0 = actx.currentTime + d;
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol * .14, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + len);
        o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + len + .05);
      });
    } catch {}
  }

  /* --- Sound --- */
  let actx;
  function playSound(c, customUrl) {
    const vol = c.aVolume / 100;
    if (vol <= 0) return;
    const url = customUrl || '';
    if (url) { const au = new Audio(url); au.volume = vol; au.play().catch(() => {}); return; }
    if (c.aSound === 'none' || c.aSound === 'custom') return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = c.aSound === 'coin' ? [988, 1319] : c.aSound === 'mc' ? [1319, 1760, 2093] : [659, 784, 1047];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = c.aSound === 'coin' ? 'square' : c.aSound === 'mc' ? 'sine' : 'triangle';
        o.frequency.value = f;
        const t0 = actx.currentTime + i * 0.11;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(vol * 0.25, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
        o.connect(g).connect(actx.destination);
        o.start(t0); o.stop(t0 + 0.5);
      });
    } catch {}
  }

  /* --- Twitch-Chat: Subs, Gifts, Raids, Bits, !popup --- */
  const popupCmd = (cfg.aPopupCmd || '!popup').toLowerCase();
  function handle(m) {
    if (m.command === 'ROOMSTATE') { E.setRoom(m.tags['room-id']); return; }
    if (m.command === 'PRIVMSG') {
      const text = m.params[1] || '';
      const p = text.trim().toLowerCase().split(/\s+/);
      if (isStaff(m.tags) && p[0] === (cfg.aCmd || '!alerts').toLowerCase()) {
        if (p[1] === 'skip') { current && current.finish(); window.speechSynthesis && speechSynthesis.cancel(); }
        else if (p[1] === 'pause') paused = true;
        else if (p[1] === 'resume') { paused = false; if (!busy) next(); }
        else if (p[1] === 'replay' && lastEv) { queue.unshift({ ...lastEv }); if (!busy && !paused) next(); }
        return;
      }
      if (cfg.aPopup && isStaff(m.tags) && text.toLowerCase().startsWith(popupCmd + ' ')) {
        push({ kind: 'popup', title: text.slice(popupCmd.length + 1).trim(), by: m.tags['display-name'] || m.login });
        return;
      }
    }
    push(parseEvent(m));
  }

  window.addEventListener('message', e => { if (e.data && e.data.tco === 'test') push(sampleEvent(e.data.kind, E.emotes)); });

  E.loadBadges();
  E.load();
  setInterval(E.load, 5 * 60 * 1000);
  if (cfg.channel) connectIRC(cfg.channel, handle);
  if (cfg.seToken) connectSE(cfg.seToken.trim(), push);
  if (cfg.slToken) connectSL(cfg.slToken.trim(), push);
  if (cfg.demo) {
    const kinds = ['sub', 'resub', 'gift', 'mass', 'raid', 'bits', 'follow', 'tip'];
    let i = 0;
    setTimeout(function loop() { const k = kinds[i++ % kinds.length]; push(sampleEvent(k, E.emotes)); setTimeout(loop, (typeCfg(k).aLen + 2.5) * 1000); }, 800);
  }
}

const BAR_COLORS = {

  pink:   ['#4e0e3c', '#ff9ee6', '#ec54c2', '#b02d8c'],
  blue:   ['#0b2f4d', '#7fd4ff', '#2ba7ea', '#1a6fb0'],

const MCF = { ready: null, glyphs: new Map() };
function loadMcFont() {
  if (MCF.ready) return MCF.ready;
  MCF.ready = new Promise(done => probeMcTextures(ok => {
    if (!ok) return done(false);
    const root = mcTexBase.replace(/textures\/$/, '');
    fetch(root + 'font/include/default.json').then(r => r.json()).then(def => Promise.all(def.providers.filter(p => p.type === 'bitmap').map(p => new Promise((res, rej) => {
      const img = new Image();

      img.src = mcTexBase + p.file.replace(/^minecraft:/, '');
    })))).then(list => {
      for (const { p, img } of list) {   // die erste Datei, die ein Zeichen hat, gewinnt (wie im Spiel)
        const rows = p.chars, cw = img.width / [...rows[0]].length, ch = img.height / rows.length;
        const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
        const x = c.getContext('2d'); x.drawImage(img, 0, 0);

function mcTextImage(text, color, shadow) {
  const items = [];

  for (const chr of [...text]) {
    if (chr === ' ' || chr === ' ') { W += 4; continue; }
    const g = MCF.glyphs.get(chr);
    if (g) { items.push({ g, x: W }); W += g.adv; top = Math.max(top, g.ascent); bot = Math.max(bot, g.height - g.ascent); }

function useMcFont(root) {

      const k = parseFloat(cs.fontSize) / 8;
      const sh = el.classList.contains('bb-text') ? (cs.getPropertyValue('--bts').trim() || quarterColor(color)) : quarterColor(color);
